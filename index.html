<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzLearnTyping</title>
<style>
    :root {
        --bg: #0a0c10; 
        --text: #ffffff; 
        --accent: #e6b450;
    }
    * { box-sizing: border-box; }
    body {
        background-image: 
            linear-gradient(to bottom, rgba(10, 12, 16, 0.6) 0%, rgba(10, 12, 16, 0.95) 100%),
            url('fantasia.png'); 
        background-size: cover;
        background-position: center top; 
        background-attachment: fixed;
        background-color: var(--bg);
        
        color: var(--text); 
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0; padding: 20px; 
        display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        overflow-x: hidden;
    }

    /* --- HEADER / NAVBAR --- */
    .navbar {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: flex-end; /* Ikon garis tiga di kanan */
        padding: 10px 0;
        position: relative;
        z-index: 10;
    }

    .menu-icon {
        font-size: 30px;
        cursor: pointer;
        color: white;
        text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        transition: 0.2s;
    }
    .menu-icon:hover { color: var(--accent); }

    /* --- SIDEBAR MENU (Tersembunyi) --- */
    .sidebar {
        position: fixed;
        top: 0;
        right: -250px; /* Sembunyi di kanan */
        width: 250px;
        height: 100vh;
        background-color: rgba(18, 21, 28, 0.95);
        backdrop-filter: blur(10px);
        border-left: 1px solid #333;
        padding: 30px 20px;
        transition: 0.3s ease-in-out;
        z-index: 100;
        box-shadow: -5px 0 15px rgba(0,0,0,0.5);
    }

    .sidebar.active {
        right: 0; /* Muncul ke layar */
    }

    .sidebar h3 {
        color: var(--accent);
        margin-bottom: 20px;
        font-size: 18px;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
    }

    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 12px 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        transition: 0.2s;
        font-size: 15px;
    }

    .sidebar a:hover {
        background: var(--accent);
        color: black;
    }

    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
        color: #aaa;
    }
    .close-btn:hover { color: white; }


    /* --- DASHBOARD CONTENT --- */
    .dashboard {
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        margin-top: 5vh;
        width: 100%;
        max-width: 600px;
    }

    .tagline {
        font-size: 20px; 
        font-weight: 800;
        color: #ff3333; 
        text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        line-height: 1.4;
        text-align: left;
        width: 100%;
        margin-bottom: 40px;
    }

    .row-top {
        display: flex;
        gap: 20px;
        justify-content: center;
        width: 100%;
        margin-bottom: 25px;
    }

    /* Tombol Atas (Get Started & Langganan) */
    .btn-oval {
        padding: 15px 35px;
        border-radius: 50px;
        font-weight: 800;
        font-size: 18px;
        cursor: pointer;
        border: none;
        background: rgba(255, 255, 255, 0.85); 
        color: #000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        text-decoration: none;
        text-align: center;
        transition: 0.2s;
    }
    .btn-oval:hover {
        background: #ffffff;
        transform: scale(1.05);
    }

    /* Tombol Bawah (Menuju Web Satunya) */
    .btn-rect {
        padding: 15px 30px;
        border-radius: 5px; 
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
        border: none;
        background: rgba(150, 150, 150, 0.8); 
        color: #000;
        text-decoration: none;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: 0.2s;
        line-height: 1.3;
    }
    .btn-rect:hover {
        background: rgba(200, 200, 200, 0.9);
    }

    @media (max-width: 400px) {
        .row-top { flex-direction: column; gap: 15px; }
        .btn-oval { width: 100%; }
    }
</style>
</head>
<body>

    <!-- NAVBAR KANAN ATAS -->
    <div class="navbar">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
    </div>

    <!-- SIDEBAR MENU -->
    <div class="sidebar" id="mySidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <h3>Menu</h3>
        <a href="#" onclick="alert('Buka Halaman Kotak Masuk')">📬 Kotak Masuk</a>
        <a href="#" onclick="alert('Buka Halaman Web yang Dibuat')">🌐 Web Saya</a>
        <a href="#" onclick="alert('Buka Pengaturan')">⚙️ Pengaturan</a>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="dashboard">
        <!-- Teks Tagline -->
        <div class="tagline">
            "Make Your Own Website, For your Own Way"
        </div>

        <!-- Baris Atas: Get Started & Langganan -->
        <div class="row-top">
            <a href="#" class="btn-oval" onclick="alert('Mulai Ngetik!')">Get Started</a>
            <a href="creator.html" class="btn-oval">Langganan</a> 
        </div>

        <!-- Baris Bawah: Menuju Web Satunya -->
        <a href="creator.html" class="btn-rect">
            Menuju<br>LyzLearnTyping
        </a>
    </div>

    <script>
        // Fungsi buat buka/tutup sidebar menu
        function toggleMenu() {
            const sidebar = document.getElementById('mySidebar');
            sidebar.classList.toggle('active');
        }
    </script>
</body>
</html>

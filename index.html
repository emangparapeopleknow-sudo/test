<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Web - Dashboard</title>
<style>
    :root {
        --bg: #0a0c10; --text: #ffffff; --accent: #e6b450; --cursor: #5fb8ff;
    }
    * { box-sizing: border-box; }
    body {
        background-image: linear-gradient(to bottom, rgba(10, 12, 16, 0.5) 0%, rgba(10, 12, 16, 0.95) 100%), url('fantasia.png'); 
        background-size: cover; background-position: center top; background-attachment: fixed;
        background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
    }

    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(2px); }
    .overlay.active { display: block; }

    .navbar { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; margin-bottom: 5vh; z-index: 10; }
    .tagline { font-size: 24px; font-weight: 800; color: #ff3333; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); line-height: 1.3; max-width: 70%; }

    /* MUSIC PLAYER */
    .music-player {
        position: fixed; bottom: 30px; left: 30px; display: flex; align-items: center; gap: 15px;
        background: rgba(18, 21, 28, 0.8); padding: 10px 20px; border-radius: 50px;
        backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50;
    }
    .music-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transition: 0.2s; }
    .music-btn:hover { color: var(--accent); transform: scale(1.1); }
    .music-info { font-size: 14px; color: #ddd; font-weight: 600; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

    .menu-container { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 10px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; z-index: 105; }
    .menu-container:hover { background: rgba(255,255,255,0.2); }
    .menu-icon { font-size: 24px; color: white; line-height: 1; }

    .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background-color: rgba(18, 21, 28, 0.98); backdrop-filter: blur(15px); border-left: 1px solid #333; padding: 40px 20px; transition: 0.3s ease-in-out; z-index: 110; box-shadow: -5px 0 20px rgba(0,0,0,0.8); }
    .sidebar.active { right: 0; }
    .sidebar h3 { color: var(--accent); margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .sidebar a { display: block; color: white; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.2s; font-size: 16px; cursor: pointer; }
    .sidebar a:hover { background: var(--accent); color: black; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
    .close-btn:hover { color: white; }

    .dashboard { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; max-width: 600px; margin-bottom: 10vh; z-index: 10; }
    .row-top { display: flex; gap: 20px; justify-content: center; width: 100%; margin-bottom: 30px; }

    .btn-oval { padding: 18px 45px; border-radius: 50px; font-weight: 800; font-size: 20px; cursor: pointer; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-decoration: none; text-align: center; transition: 0.3s; }
    .btn-oval:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px); }

    .btn-rect { padding: 18px 40px; border-radius: 10px; font-weight: bold; font-size: 20px; cursor: pointer; background: rgba(255, 255, 255, 0.8); color: #000; text-decoration: none; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: 0.3s; line-height: 1.3; }
    .btn-rect:hover { background: #fff; transform: translateY(-3px); }

    /* MODAL PENCARIAN LAGU */
    #music-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: #12151c; padding: 25px; border-radius: 16px; border: 1px solid var(--accent); text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-content h3 { color: var(--accent); margin-bottom: 15px; }
    
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none; }
    .search-box button { padding: 12px 20px; border-radius: 8px; border: none; background: var(--accent); color: black; font-weight: bold; cursor: pointer; }
    
    .song-results { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; text-align: left; }
    .song-item { background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #333; display: flex; align-items: center; gap: 15px; }
    .song-item:hover { background: rgba(255,255,255,0.1); border-color: var(--cursor); }
    .song-item img { width: 40px; height: 40px; border-radius: 5px; }
    .song-info { display: flex; flex-direction: column; }
    .song-title { font-weight: bold; font-size: 14px; color: #fff; }
    .song-artist { font-size: 12px; color: #aaa; }

    @media (max-width: 450px) {
        .tagline { font-size: 20px; max-width: 65%; }
        .row-top { flex-direction: column; gap: 15px; }
        .btn-oval, .btn-rect { width: 100%; }
        .music-player { bottom: 20px; left: 20px; padding: 8px 15px; }
    }
</style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <audio id="bg-music" loop>
        <source id="audio-source" src="" type="audio/mpeg">
    </audio>

    <div class="navbar">
        <div class="tagline">"Make Your Own Web,<br>For Your Own Way"</div>
        <div class="menu-container" onclick="toggleMenu()"><div class="menu-icon">☰</div></div>
    </div>

    <div class="music-player">
        <button class="music-btn" id="play-btn" onclick="toggleMusic()">▶️</button>
        <div class="music-info" id="now-playing">Pilih Lagu</div>
    </div>

    <div class="sidebar" id="mySidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <h3>Menu Creator</h3>
        <a onclick="alert('Buka Kotak Masuk')">📬 Kotak Masuk</a>
        <a onclick="alert('Buka History')">📜 History Permintaan</a>
        <a onclick="bukaModalLagu()" style="color: var(--accent); border: 1px solid var(--accent);">🎵 Cari Lagu</a>
        <a onclick="alert('Buka Pengaturan')">⚙️ Pengaturan</a>
    </div>

    <div class="dashboard">
        <div class="row-top">
            <a href="#" class="btn-oval" onclick="alert('Get Started')">Get Started</a>
            <a href="#" class="btn-oval" style="background: rgba(230, 180, 80, 0.8); color: #000; border: none;" onclick="alert('Langganan')">Langganan</a> 
        </div>
        <a href="index.html" class="btn-rect">Menuju<br>LyzLearnTyping</a>
    </div>

    <!-- MODAL PENCARIAN LAGU -->
    <div id="music-modal">
        <div class="modal-content">
            <h3>🎵 Cari Lagu</h3>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Ketik judul lagu..." onkeypress="if(event.key === 'Enter') cariLagu()">
                <button onclick="cariLagu()">Cari</button>
            </div>
            <div class="song-results" id="song-results">
                <p style="color: #888; text-align: center;">Ketik judul lagu lalu tekan Enter.</p>
            </div>
            <button class="btn-oval" style="padding: 10px 20px; font-size: 14px; width: 100%; margin-top: 20px;" onclick="tutupModalLagu()">Tutup</button>
        </div>
    </div>

    <script>
        // --- LOGIKA SIDEBAR ---
        const sidebar = document.getElementById('mySidebar');
        const overlay = document.getElementById('overlay');
        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // --- LOGIKA MUSIK ---
        const music = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const audioSource = document.getElementById('audio-source');
        const nowPlaying = document.getElementById('now-playing');

        function toggleMusic() {
            if (!music.src || music.src === window.location.href) {
                alert("Cari lagu dulu di menu 🎵 Cari Lagu!");
                return;
            }

            if (music.paused) {
                music.play();
                playBtn.innerText = "⏸️"; 
            } else {
                music.pause();
                playBtn.innerText = "▶️"; 
            }
        }

        // --- LOGIKA PENCARIAN LAGU (iTunes API) ---
        function bukaModalLagu() {
            toggleMenu(); 
            document.getElementById('music-modal').style.display = 'flex';
        }

        function tutupModalLagu() {
            document.getElementById('music-modal').style.display = 'none';
        }

        async function cariLagu() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const resultsDiv = document.getElementById('song-results');
            resultsDiv.innerHTML = '<p style="color: var(--accent); text-align: center;">Mencari lagu...</p>';

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
                const data = await response.json();

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="color: #888; text-align: center;">Lagu tidak ditemukan.</p>';
                    return;
                }

                resultsDiv.innerHTML = '';
                data.results.forEach(song => {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.onclick = () => putarLagu(song.previewUrl, song.trackName, song.artistName);
                    
                    item.innerHTML = `
                        <img src="${song.artworkUrl60}" alt="cover">
                        <div class="song-info">
                            <span class="song-title">${song.trackName}</span>
                            <span class="song-artist">${song.artistName}</span>
                        </div>
                    `;
                    resultsDiv.appendChild(item);
                });

            } catch (error) {
                resultsDiv.innerHTML = '<p style="color: red; text-align: center;">Gagal mencari lagu. Cek internet.</p>';
            }
        }

        function putarLagu(url, judul, artis) {
            if (!url) {
                alert("Lagu ini tidak punya preview audio.");
                return;
            }
            
            audioSource.src = url;
            music.load();
            
            nowPlaying.innerText = `${judul} - ${artis}`;

            music.play();
            playBtn.innerText = "⏸️";

            tutupModalLagu();
        }
    </script>
</body>
</html>

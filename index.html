<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Web - Dashboard</title>
<style>
    :root {
        --bg: #0a0c10; 
        --text: #ffffff; 
        --accent: #e6b450;
    }
    * { box-sizing: border-box; }
    body {
        /* Pastiin file 'fantasia.png' ada di folder yang sama */
        background-image: 
            linear-gradient(to bottom, rgba(10, 12, 16, 0.5) 0%, rgba(10, 12, 16, 0.95) 100%),
            url('fantasia.png'); 
        background-size: cover;
        background-position: center top; 
        background-attachment: fixed;
        background-color: var(--bg);
        
        color: var(--text); 
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0; padding: 20px; 
        display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }

    /* --- HEADER NAVIGASI --- */
    .navbar {
        width: 100%;
        display: flex;
        justify-content: space-between; 
        align-items: flex-start;
        padding: 10px 0;
        margin-bottom: 5vh;
    }

    .tagline {
        font-size: 24px; 
        font-weight: 800;
        color: #ff3333; 
        text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        line-height: 1.3;
        text-align: left;
        max-width: 70%;
    }

    /* --- MUSIC PLAYER (KIRI BAWAH) --- */
    .music-player {
        position: fixed; bottom: 30px; left: 30px;
        display: flex; align-items: center; gap: 15px;
        background: rgba(18, 21, 28, 0.8);
        padding: 10px 20px; border-radius: 50px;
        backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50;
    }
    .music-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transition: 0.2s; }
    .music-btn:hover { color: var(--accent); transform: scale(1.1); }
    .music-info { font-size: 14px; color: #ddd; font-weight: 600; }

    /* --- Ikon Garis Tiga Kanan Atas --- */
    .menu-container {
        background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 10px;
        backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
        cursor: pointer; transition: 0.2s;
    }
    .menu-container:hover { background: rgba(255,255,255,0.2); }
    .menu-icon { font-size: 24px; color: white; line-height: 1; }

    /* --- SIDEBAR MENU --- */
    .sidebar {
        position: fixed; top: 0; right: -280px; width: 280px; height: 100vh;
        background-color: rgba(18, 21, 28, 0.98); backdrop-filter: blur(15px);
        border-left: 1px solid #333; padding: 40px 20px;
        transition: 0.3s ease-in-out; z-index: 100; box-shadow: -5px 0 20px rgba(0,0,0,0.8);
    }
    .sidebar.active { right: 0; }
    .sidebar h3 { color: var(--accent); margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .sidebar a { display: block; color: white; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.2s; font-size: 16px; }
    .sidebar a:hover { background: var(--accent); color: black; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
    .close-btn:hover { color: white; }

    /* --- KONTEN UTAMA --- */
    .dashboard {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        flex: 1; width: 100%; max-width: 600px; margin-bottom: 10vh;
    }

    .row-top { display: flex; gap: 20px; justify-content: center; width: 100%; margin-bottom: 30px; }

    /* Tombol Kaca (Glassmorphism) */
    .btn-oval {
        padding: 18px 45px; border-radius: 50px; font-weight: 800; font-size: 20px;
        cursor: pointer; background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3); color: #fff;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-decoration: none; text-align: center; transition: 0.3s;
    }
    .btn-oval:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px); }

    /* Tombol Menuju Web Satunya */
    .btn-rect {
        padding: 18px 40px; border-radius: 10px; font-weight: bold; font-size: 20px;
        cursor: pointer; background: rgba(255, 255, 255, 0.8); color: #000;
        text-decoration: none; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        transition: 0.3s; line-height: 1.3;
    }
    .btn-rect:hover { background: #fff; transform: translateY(-3px); }

    /* Responsif HP */
    @media (max-width: 450px) {
        .tagline { font-size: 20px; max-width: 65%; }
        .row-top { flex-direction: column; gap: 15px; }
        .btn-oval, .btn-rect { width: 100%; }
        .music-player { bottom: 20px; left: 20px; padding: 8px 15px; }
    }
</style>
</head>
<body>

    <!-- AUDIO ELEMENT (GANTI NAMA FILE LAGUNYA NANTI) -->
    <audio id="bg-music" loop>
        <source src="lagu-fantasia.mp3" type="audio/mpeg">
    </audio>

    <!-- HEADER -->
    <div class="navbar">
        <div class="tagline">
            "Make Your Own Web,<br>For Your Own Way"
        </div>
        
        <div class="menu-container" onclick="toggleMenu()">
            <div class="menu-icon">☰</div>
        </div>
    </div>

    <!-- MUSIC PLAYER -->
    <div class="music-player">
        <button class="music-btn" id="play-btn" onclick="toggleMusic()">▶️</button>
        <div class="music-info">Fantasia - Magnolia</div>
    </div>

    <!-- SIDEBAR MENU -->
    <div class="sidebar" id="mySidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <h3>Menu Creator</h3>
        <a href="#" onclick="alert('Buka Halaman Kotak Masuk')">📬 Kotak Masuk</a>
        <a href="#" onclick="alert('Buka Halaman Web yang Dibuat')">🌐 Web Saya</a>
        <a href="#" onclick="alert('Buka Pengaturan')">⚙️ Pengaturan</a>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="dashboard">
        <div class="row-top">
            <!-- Tombol ini nanti lu arahin ke halaman AI Generator -->
            <a href="#" class="btn-oval" onclick="alert('Masuk ke AI Generator (Segera)')">Get Started</a>
            
            <!-- Tombol ini nanti lu arahin ke halaman Langganan/Premium -->
            <a href="#" class="btn-oval" style="background: rgba(230, 180, 80, 0.8); color: #000; border: none;" onclick="alert('Masuk ke Halaman Langganan (Segera)')">Langganan</a> 
        </div>

        <!-- Tombol Pindah ke Web Belajar Ngetik -->
        <a href="index.html" class="btn-rect">
            Menuju<br>LyzLearnTyping
        </a>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mySidebar').classList.toggle('active');
        }

        const music = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                playBtn.innerText = "⏸️"; 
            } else {
                music.pause();
                playBtn.innerText = "▶️"; 
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #070b14;
        --gradient-color: linear-gradient(90deg, #ff0000, #ff7b00);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .loader-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 220px;
        height: 50px;
    }

    .brand-text {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #ffffff;
        z-index: 2;
        opacity: 0;
        animation: fadeIn 0.5s ease forwards;
        animation-delay: 0.2s;
    }

    .line-wrapper {
        position: absolute;
        width: 100%;
        height: 2px;
        left: 0;
    }

    .line-top { top: 0; }
    .line-bottom { bottom: 0; }

    .line {
        position: absolute;
        height: 100%;
        width: 0;
        left: 50%;
        transform: translateX(-50%);
        background: var(--gradient-color);
        box-shadow: 0 0 8px #ff7b00;
    }

    .line-top .line {
        border-radius: 0 0 2px 2px;
        animation: animLine 1.6s infinite ease-in-out;
    }

    .line-bottom .line {
        border-radius: 2px 2px 0 0;
        animation: animLine 1.6s infinite ease-in-out;
    }

    @keyframes animLine {
        0% { width: 0; }
        40% { width: 100%; }
        100% { width: 100%; }
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>
</head>
<body>

    <div class="loader-container">
    <div class="line-wrapper line-top">
        <div class="line"></div>
    </div>
    
    <div class="brand-text">LYZ CREATOR</div>
    
    <div class="line-wrapper line-bottom">
        <div class="line"></div>
    </div>
</div>

<script>
    setTimeout(() => {
        window.location.href = "login.html"; 
    }, 4000);
</script>

</body>
</html>

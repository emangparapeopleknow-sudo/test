<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  body { background-color: #0a0c10; color: #e6b450; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
  .loader { font-size: 20px; font-weight: bold; animation: blink 1s infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
</style>
</head>
<body>
  <div class="loader">Membuka Creator Web...</div>

  <script>
    // Cek apakah user udah login atau belum
    const activeUser = localStorage.getItem('creator_active_user');
    
    // Kasih delay dikit biar ga kaget (opsional)
    setTimeout(() => {
      if (activeUser) {
        // Kalau udah login, masuk ke dashboard
        window.location.replace("creator.html");
      } else {
        // Kalau belum login, lempar ke halaman login
        window.location.replace("login.html");
      }
    }, 500); // 500ms = setengah detik
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #070b14;
        --gradient-color: linear-gradient(90deg, #ff0000, #ff7b00);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .loader-box {
        position: relative;
        padding: 15px 30px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .brand-text {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #ffffff;
        z-index: 2;
        opacity: 0;
        animation: fadeIn 0.5s ease forwards;
        animation-delay: 0.2s;
        text-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
    }

    .line-top, .line-bottom {
        position: absolute;
        height: 2px;
        width: 0;
        left: 50%;
        transform: translateX(-50%);
        background: var(--gradient-color);
        box-shadow: 0 0 8px #ff7b00;
        transition: width 0.4s ease-in-out;
    }

    .line-top { top: 0; }
    .line-bottom { bottom: 0; }

    .side-left, .side-right {
        position: absolute;
        width: 2px;
        height: 0;
        top: 50%;
        transform: translateY(-50%);
        background: var(--gradient-color);
        box-shadow: 0 0 8px #ff7b00;
        transition: height 0.4s ease-in-out;
        transition-delay: 0.4s;
    }

    .side-left { left: 0; }
    .side-right { right: 0; }

    .loader-box.expand .line-top,
    .loader-box.expand .line-bottom {
        width: 100%;
    }

    .loader-box.expand .side-left,
    .loader-box.expand .side-right {
        height: 100%;
    }

    .loader-box.expand .brand-text {
        color: #ffffff;
        text-shadow: 0 0 15px #ff7b00, 0 0 30px #ff0000;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>
</head>
<body>

    <div class="loader-box" id="loaderBox">
    <div class="line-top"></div>
    <div class="line-bottom"></div>
    <div class="side-left"></div>
    <div class="side-right"></div>
    <div class="brand-text">LYZ CREATOR</div>
</div>

<script>
    const box = document.getElementById('loaderBox');
    let isExpanded = false;

    function animateLoader() {
        if (!isExpanded) {
            box.classList.add('expand');
            isExpanded = true;
        } else {
            box.classList.remove('expand');
            isExpanded = false;
        }
    }

    setInterval(animateLoader, 1600);

    setTimeout(() => {
        window.location.replace("creator.html"); 
    }, 3500);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #070b14;
        --card-bg: #111625;
        --card-border: #232c45;
        --primary: #7f5af0;
        --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%);
        --text-main: #ffffff;
        --text-muted: #8b94b0;
        --input-bg: #1a2035;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: var(--bg-dark);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .header-icon {
        cursor: pointer;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
    }

    .header-right {
        display: flex;
        gap: 15px;
    }

    .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
    }

    .logo-center {
        width: 60px;
        height: 60px;
        background: var(--primary-grad);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 900;
        color: #fff;
        margin-bottom: 20px;
        box-shadow: 0 0 30px rgba(127, 90, 240, 0.4);
    }

    .greeting {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
    }

    .bottom-area {
        padding: 15px 20px 30px;
        background: var(--bg-dark);
        z-index: 10;
    }

    .input-box {
        background: var(--input-bg);
        border: 1px solid var(--card-border);
        border-radius: 25px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .input-box input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-main);
        font-size: 15px;
        width: 100%;
    }

    .input-box input::placeholder {
        color: var(--text-muted);
    }

    .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .action-toggles {
        display: flex;
        gap: 10px;
    }

    .toggle-btn {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .toggle-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
    }

    .toggle-btn.active {
        border-color: var(--primary);
        color: var(--primary);
        background: rgba(127, 90, 240, 0.1);
    }

    .right-actions {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .btn-icon {
        background: transparent;
        border: none;
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
    }
    
    .btn-icon svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
    }

        .bottom-sheet {
        position: fixed;
        bottom: -100%;
        left: 0;
        width: 100%;
        background: var(--bg-dark);
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        padding: 20px;
        z-index: 200;
        transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-top: 1px solid var(--card-border);
    }

    .bottom-sheet.active {
        bottom: 0;
    }

    .sheet-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 150;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
    }

    .sheet-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .carousel {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 20px;
        margin-bottom: 10px;
    }

    .carousel::-webkit-scrollbar {
        display: none;
    }

    .carousel-item {
        min-width: 100px;
        height: 100px;
        background: var(--card-bg);
        border-radius: 15px;
        border: 1px solid var(--card-border);
        flex-shrink: 0;
    }

    .upload-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .upload-card {
        background: #23252b;
        border-radius: 20px;
        padding: 25px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
    }

    .upload-card svg {
        width: 28px;
        height: 28px;
        stroke: var(--text-main);
        fill: none;
        stroke-width: 1.5;
    }

    .upload-card span.text {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
    }
</style>
</head>
<body>

    <div class="header">
    <div class="header-icon" onclick="window.location.href='creator.html'">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </div>
    <div class="header-right">
        <div class="header-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </div>
        <div class="header-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="10" x2="15" y2="10"></line><line x1="12" y1="7" x2="12" y2="13"></line></svg>
        </div>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="logo-center">L</div>
    <h2 class="greeting" id="greetingText">Selamat siang. Ada yang bisa saya bantu?</h2>
</div>

<div class="bottom-area">
    <div class="input-box">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau tahan untuk bicara">
        <div class="input-actions">
            <div class="action-toggles">
                <button class="toggle-btn" onclick="toggleAction(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Berpikir
                </button>
                <button class="toggle-btn" onclick="toggleAction(this)">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Cari
                </button>
            </div>
            <div class="right-actions">
                <button class="btn-icon" onclick="openSheet()">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
                <button class="btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="bottomSheet">
    <div class="carousel">
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
    </div>
    <div class="upload-options">
        <div class="upload-card">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span class="text">Kamera</span>
        </div>
        <div class="upload-card">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span class="text">Album</span>
        </div>
        <div class="upload-card">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            <span class="text">Dokumen</span>
        </div>
    </div>
</div>                

    <script>
    const hour = new Date().getHours();
    const greetingText = document.getElementById('greetingText');
    
    if (hour < 11) {
        greetingText.innerText = "Selamat pagi. Ada yang bisa saya bantu?";
    } else if (hour < 15) {
        greetingText.innerText = "Selamat siang. Ada yang bisa saya bantu?";
    } else if (hour < 18) {
        greetingText.innerText = "Selamat sore. Ada yang bisa saya bantu?";
    } else {
        greetingText.innerText = "Selamat malam. Ada yang bisa saya bantu?";
    }

    function toggleAction(btn) {
        btn.classList.toggle('active');
    }

    function openSheet() {
        document.getElementById('bottomSheet').classList.add('active');
        document.getElementById('sheetOverlay').classList.add('active');
    }

    function closeSheet() {
        document.getElementById('bottomSheet').classList.remove('active');
        document.getElementById('sheetOverlay').classList.remove('active');
    }

    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && chatInput.value.trim() !== '') {
            document.getElementById('chatContainer').style.justifyContent = 'flex-start';
            greetingText.style.display = 'none';
            
            const userBubble = document.createElement('div');
            userBubble.style.cssText = "align-self: flex-end; background: var(--primary); padding: 12px 18px; border-radius: 20px 20px 5px 20px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
            userBubble.innerText = chatInput.value;
            document.getElementById('chatContainer').appendChild(userBubble);
            
            chatInput.value = '';
            
            setTimeout(() => {
                const aiBubble = document.createElement('div');
                aiBubble.style.cssText = "align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 18px; border-radius: 20px 20px 20px 5px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
                aiBubble.innerText = "Ini adalah respons simulasi. Sambungkan ke api/chat.js untuk hasil nyata.";
                document.getElementById('chatContainer').appendChild(aiBubble);
            }, 1000);
        }
    });
</script>

</body>
</html>

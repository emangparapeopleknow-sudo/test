<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Web Generator - LyzCreator</title>
<style>
  :root { --bg: #0a0c10; --panel: #12151c; --accent: #e6b450; --text: #ffffff; --border: #2a2f3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }
  
  #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; transition: transform 0.3s; z-index: 1000; }
  @media (max-width: 768px) { #sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); } #sidebar.show { transform: translateX(0); } }
  .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h2 { font-size: 16px; color: var(--accent); }
  #closeSidebar { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
  @media (max-width: 768px) { #closeSidebar { display: block; } }
  .btn-new-chat { margin: 15px; padding: 10px; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: bold; }
  #history-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .history-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #aaa; }
  .history-item:hover, .history-item.active { background: #1e2430; color: var(--text); }
  .btn-delete { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; display: none; }
  .history-item:hover .btn-delete { display: block; }
  .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #main { flex: 1; display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden; position: relative; }
  .top-bar { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; height: 56px; }
  .nav-btns { display: flex; gap: 10px; align-items: center; }
  #openSidebar { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; }
  @media (max-width: 768px) { #openSidebar { display: block; } }
  .btn-back { text-decoration: none; color: var(--accent); font-size: 14px; font-weight: bold; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; }
  .btn-upgrade { background: #2a3163; color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: bold; }

  #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #fff; text-align: center; padding: 20px; }
  #empty-state h2 { font-size: 20px; font-weight: 600; }

  #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
  .msg-user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
  .msg-ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }
  
  /* GAMBAR DI DALAM CHAT */
  .msg-image { max-width: 200px; border-radius: 8px; margin-top: 10px; display: block; }
  
  .code-wrapper { background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 10px; overflow: hidden; }
  .code-header { background: #1a1a1a; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12px; color: #aaa; border-bottom: 1px solid #333; }
  .code-box { padding: 12px; overflow-x: auto; color: #a9b7c6; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
</style>
<style>
  .file-preview { display: flex; gap: 10px; padding: 10px; background: #1e2430; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .file-badge { background: var(--accent); color: black; padding: 5px 10px; border-radius: 5px; font-size: 12px; display: flex; align-items: center; gap: 5px;}
  
  .mode-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--bg); border-bottom: 1px solid var(--border); position: relative; }
  .mode-selector { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .mode-selector h3 { font-size: 16px; font-weight: normal; color: #ddd; }
  .mode-selector.active h3 { color: var(--accent); }
  
  .dropdown-mode { display: none; position: absolute; top: 50px; left: 15px; background: #1e1e1e; border-radius: 16px; width: 250px; padding: 15px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #333; }
  .dropdown-mode.show { display: block; }
  .mode-option { display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 10px; cursor: pointer; }
  .mode-option:hover { background: #2a2a2a; }
  .mode-option.locked { opacity: 0.5; cursor: not-allowed; }
  .mode-icon { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
  .mode-info h4 { font-size: 15px; color: #fff; margin-bottom: 2px; font-weight: normal; }
  .mode-info p { font-size: 12px; color: #888; }
  .mode-check { margin-left: auto; color: #fff; display: none; }
  .mode-option.selected .mode-check { display: block; }

  .input-area { padding: 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; width: 100%; }
  .input-row { display: flex; gap: 10px; width: 100%; align-items: center; background: #1e2430; border-radius: 20px; padding: 5px 10px; border: 1px solid var(--border); }
  #attach-btn { background: transparent; border: none; color: #aaa; padding: 10px; cursor: pointer; font-size: 24px; line-height: 1; }
  #chat-input { flex: 1; padding: 10px 0; background: transparent; border: none; color: var(--text); outline: none; resize: none; font-size: 14px; max-height: 100px; }
  #sendBtn { padding: 8px; border: none; border-radius: 50%; background: var(--accent); color: var(--bg); font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; width: 35px; height: 35px; flex-shrink: 0; }

  .bottom-sheet-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; }
  .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #12151c; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; transform: translateY(100%); transition: transform 0.3s; }
  .bottom-sheet.show { transform: translateY(0); }
  .bs-handle { width: 40px; height: 5px; background: #333; border-radius: 3px; margin: 0 auto 20px auto; }
  .bs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .bs-item { background: #1e2430; border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; }
  .bs-item svg { width: 30px; height: 30px; fill: #fff; }

  #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
  .alert-box { background: #2c2c2e; color: #fff; width: 80%; max-width: 320px; border-radius: 16px; overflow: hidden; text-align: center; display: flex; flex-direction: column; }
  .alert-title { padding: 25px 20px 10px 20px; font-weight: bold; font-size: 17px; }
  .alert-message { padding: 0 20px 25px 20px; font-size: 14px; color: #ccc; }
  .alert-btn { background: transparent; border: none; border-top: 1px solid #444; color: #0a84ff; width: 100%; padding: 16px; font-size: 17px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="custom-alert">
    <div class="alert-box">
        <div class="alert-title" id="alert-title">Pemberitahuan</div>
        <div class="alert-message" id="alert-message">Pesan notifikasi akan muncul di sini.</div>
        <button class="alert-btn" onclick="tutupAlert()">Oke</button>
    </div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    <h2>History Chat</h2>
    <button id="closeSidebar" onclick="toggleSidebar()">✖</button>
  </div>
  <button class="btn-new-chat" onclick="newChat()">+ Obrolan Baru</button>
  <div id="history-list"></div>
</div>

<div id="main">
  <div class="top-bar">
    <div class="nav-btns">
      <button id="openSidebar" onclick="toggleSidebar()">☰</button>
      <a href="creator.html" class="btn-back">← Dashboard</a>
    </div>
    <!-- TOMBOL UPGRADE UDAH KE PREMIUM.HTML -->
    <a href="premium.html" class="btn-upgrade">Upgrade</a>
  </div>

  <div class="mode-header">
      <div class="mode-selector" onclick="toggleModeDropdown()">
          <h3 id="current-mode-text">Free</h3>
          <span style="color:#aaa;">▼</span>
      </div>
      
      <div class="dropdown-mode" id="mode-dropdown">
          <div class="mode-option selected" data-mode="free" onclick="pilihMode('free')">
              <div class="mode-icon">✓</div><div class="mode-info"><h4>Free</h4><p>Limit 5 chat, 7 generate</p></div><div class="mode-check">✓</div>
          </div>
          <div class="mode-option locked" data-mode="pro" onclick="pilihMode('pro')">
              <div class="mode-icon">🔒</div><div class="mode-info"><h4>Pro</h4><p>Cepat, Limit ∞</p></div><div class="mode-check">✓</div>
          </div>
          <div class="mode-option locked" data-mode="vip" onclick="pilihMode('vip')">
              <div class="mode-icon">🔒</div><div class="mode-info"><h4>VIP</h4><p>Analisis, Limit ∞</p></div><div class="mode-check">✓</div>
          </div>
          <div class="mode-option locked" data-mode="vvip" onclick="pilihMode('vvip')">
              <div class="mode-icon">🔒</div><div class="mode-info"><h4>VVIP</h4><p>Super Stabil, ∞</p></div><div class="mode-check">✓</div>
          </div>
          <div class="mode-option locked" data-mode="king" onclick="pilihMode('king')">
              <div class="mode-icon">🔒</div><div class="mode-info"><h4>KING</h4><p>Apapun, ∞</p></div><div class="mode-check">✓</div>
          </div>
      </div>
  </div>

  <div id="file-preview" class="file-preview" style="display: none;"></div>

  <div id="chat-box">
    <div id="empty-state">
        <h2>Halo, bagaimana saya bisa membantu?</h2>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
      <button id="attach-btn" onclick="openBottomSheet()">+</button>
      <textarea id="chat-input" rows="1" placeholder="Ketik pesan di sini..." onkeydown="handleEnter(event)" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
      <button id="sendBtn" onclick="kirimPesan()"><svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>

<div class="bottom-sheet-overlay" id="bs-overlay" onclick="closeBottomSheet()">
    <div class="bottom-sheet" id="bs-menu" onclick="event.stopPropagation()">
        <div class="bs-handle"></div>
        <div class="bs-grid">
            <div class="bs-item" onclick="triggerUpload('camera')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Kamera</div>
            <div class="bs-item" onclick="triggerUpload('album')"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Album</div>
            <div class="bs-item" onclick="triggerUpload('dokumen')"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>Dokumen</div>
        </div>
    </div>
</div>

<script>
  // LOGO BINTANG EMAS AESTHETIC
  const spiderLogoHTML = `<svg viewBox="0 0 24 24" fill="url(#starGrad)" style="width:80px; height:80px; margin-bottom:15px; filter: drop-shadow(0px 4px 10px rgba(230,180,80,0.4));"><defs><linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" /><stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" /></linearGradient></defs><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;

  function showAlert(title, message) {
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-message').innerText = message;
      document.getElementById('custom-alert').style.display = 'flex';
  }
  function tutupAlert() { document.getElementById('custom-alert').style.display = 'none'; }

  let chats = JSON.parse(localStorage.getItem('groq_chats')) || [];
  let currentChatId = null;
  let isGenerating = false;
  let selectedFiles = [];

  function openBottomSheet() { document.getElementById('bs-overlay').style.display = 'block'; setTimeout(() => document.getElementById('bs-menu').classList.add('show'), 10); }
  function closeBottomSheet() { document.getElementById('bs-menu').classList.remove('show'); setTimeout(() => document.getElementById('bs-overlay').style.display = 'none', 300); }
  function triggerUpload(type) { closeBottomSheet(); document.getElementById('file-input').click(); }

  // --- KUNCIAN MODE ---
  let premiumData = JSON.parse(localStorage.getItem('lyz_premium'));
  let currentPaket = "Free";
  if (premiumData && premiumData.expiry > Date.now()) { currentPaket = premiumData.paket; } else { localStorage.removeItem('lyz_premium'); }

  let currentMode = "free";
  if (currentPaket.includes("KING")) currentMode = "king";
  else if (currentPaket.includes("Super")) currentMode = "vvip";
  else if (currentPaket.includes("VVIP")) currentMode = "vip";
  else if (currentPaket.includes("Premium")) currentMode = "pro";

  function updateModeLocks() {
      let highestUnlocked = 'free';
      if (currentPaket.includes("KING")) highestUnlocked = 'king';
      else if (currentPaket.includes("Super")) highestUnlocked = 'vvip';
      else if (currentPaket.includes("VVIP")) highestUnlocked = 'vip';
      else if (currentPaket.includes("Premium")) highestUnlocked = 'pro';

      const hierarchy = ['free', 'pro', 'vip', 'vvip', 'king'];
      const unlockIndex = hierarchy.indexOf(highestUnlocked);

      document.querySelectorAll('.mode-option').forEach(opt => {
          const mode = opt.getAttribute('data-mode');
          if (hierarchy.indexOf(mode) > unlockIndex) {
              opt.classList.add('locked'); opt.querySelector('.mode-icon').innerText = '🔒';
          } else {
              opt.classList.remove('locked'); opt.querySelector('.mode-icon').innerText = '✓';
          }
      });
      document.getElementById('current-mode-text').innerText = currentMode.charAt(0).toUpperCase() + currentMode.slice(1);
  }
  updateModeLocks();

  function toggleModeDropdown() { document.getElementById('mode-dropdown').classList.toggle('show'); }
  
  function pilihMode(mode) {
      const opt = document.querySelector(`.mode-option[data-mode="${mode}"]`);
      if (opt.classList.contains('locked')) return showAlert("Mode Terkunci", "Upgrade paket lu di Dashboard buat buka mode ini!");
      currentMode = mode;
      document.querySelectorAll('.mode-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      document.getElementById('current-mode-text').innerText = mode.charAt(0).toUpperCase() + mode.slice(1);
      document.getElementById('mode-dropdown').classList.remove('show');
  }

  // --- CHAT LOGIC ---
  const limitKey = 'lyz_creator_limit_' + (localStorage.getItem('creator_active_user') || 'guest');
  let limitData = JSON.parse(localStorage.getItem(limitKey)) || { generate: 7, chat: 5 };
  function saveLimit() { localStorage.setItem(limitKey, JSON.stringify(limitData)); }
  function saveChats() { localStorage.setItem('groq_chats', JSON.stringify(chats)); }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

  function renderHistory() {
    const list = document.getElementById('history-list'); list.innerHTML = '';
    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
      const title = document.createElement('div'); title.className = 'history-title'; title.innerText = c.title;
      title.onclick = () => muatChat(c.id);
      const delBtn = document.createElement('button'); delBtn.className = 'btn-delete'; delBtn.innerText = '🗑';
      delBtn.onclick = (e) => { e.stopPropagation(); hapusChat(c.id); };
      item.appendChild(title); item.appendChild(delBtn); list.appendChild(item);
    });
  }

  function hapusChat(id) {
    if (!confirm('Hapus obrolan ini?')) return;
    chats = chats.filter(c => c.id !== id); saveChats();
    if (currentChatId === id) { currentChatId = chats.length > 0 ? chats[0].id : null; muatChat(currentChatId); } else { renderHistory(); }
  }

  function newChat() {
    if (window.innerWidth <= 768) toggleSidebar();
    const newId = Date.now().toString();
    chats.unshift({ id: newId, title: 'Obrolan Baru', messages: [], tipeChat: null });
    saveChats(); muatChat(newId);
  }

  function muatChat(id) {
    if (!id && chats.length > 0) id = chats[0].id;
    currentChatId = id;
    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('show');
    renderHistory();
    const box = document.getElementById('chat-box'); box.innerHTML = '';
    const chat = chats.find(c => c.id === id);
    if (!chat || chat.messages.length === 0) { box.innerHTML = `<div id="empty-state">${spiderLogoHTML}<h2>Halo, bagaimana saya bisa membantu?</h2></div>`; return; }
    chat.messages.forEach(msg => tambahPesanUI(msg.text, msg.role === 'user', msg.code, msg.tutorial, msg.img));
  }

  function handleFileSelect(event) {
    const file = event.target.files[0]; if (!file) return;
    let maxFoto = currentPaket.includes("KING") ? 8 : (currentPaket.includes("Super") ? 7 : (currentPaket.includes("VVIP") ? 5 : 2));
    if (selectedFiles.length >= maxFoto) return showAlert("Limit Foto", `Maksimal ${maxFoto} foto buat paket lu!`);
    
    const reader = new FileReader();
    reader.onload = function(e) {
      selectedFiles.push({ name: file.name, base64: e.target.result, type: file.type });
      const preview = document.getElementById('file-preview');
      preview.innerHTML = selectedFiles.map((f, i) => `<div class="file-badge">${f.name} <span onclick="hapusFile(${i})" style="cursor:pointer; color:red;">✖</span></div>`).join('');
      preview.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function hapusFile(index) {
    selectedFiles.splice(index, 1);
    if(selectedFiles.length === 0) document.getElementById('file-preview').style.display = 'none';
    else document.getElementById('file-preview').innerHTML = selectedFiles.map((f, i) => `<div class="file-badge">${f.name} <span onclick="hapusFile(${i})" style="cursor:pointer; color:red;">✖</span></div>`).join('');
  }

  function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); kirimPesan(); } }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function tambahPesanUI(text, isUser, codeContent = null, tutorialText = null, imgBase64 = null) {
    const box = document.getElementById('chat-box');
    const empty = document.getElementById('empty-state'); if(empty) empty.remove();
    const div = document.createElement('div'); div.className = 'msg ' + (isUser ? 'msg-user' : 'msg-ai');
    
    if (isUser) {
      if(imgBase64) {
          // FIX UKURAN GAMBAR BIAR GA NGE-PUSH TOMBOL
          div.innerHTML = `<img src="${imgBase64}" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block;"><br>${text}`;
      } else {
          div.innerText = text;
      }
    } else {
      if (codeContent) {
        div.innerHTML = `<div style="margin-bottom:10px; color:#ccc;">${escapeHtml(tutorialText || '')}</div><div class="code-wrapper"><div class="code-header"><span>HTML + CSS + JS</span><button onclick="salinKode(this)" style="background:none;border:none;color:var(--accent);cursor:pointer;">Salin</button></div><div class="code-box">${escapeHtml(codeContent)}</div></div>`;
      } else { div.innerHTML = text.replace(/\n/g, '<br>'); }
    }
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }

  function salinKode(btn) {
    const codeText = btn.closest('.code-wrapper').querySelector('.code-box').innerText;
    navigator.clipboard.writeText(codeText).then(() => {
      btn.innerText = 'Tersalin!'; setTimeout(() => btn.innerText = 'Salin', 2000);
      let history = JSON.parse(localStorage.getItem('lyz_history')) || [];
      history.unshift("Generate Web (Disalin)"); localStorage.setItem('lyz_history', JSON.stringify(history));
      showAlert("Tersalin", "Kode berhasil disalin & masuk ke Histori!");
    });
  }

  async function kirimPesan() {
    if (isGenerating) return;
    const input = document.getElementById('chat-input'); let text = input.value.trim();
    if (!text && selectedFiles.length === 0) return;

    let chat = chats.find(c => c.id === currentChatId);
    if (!chat) { newChat(); chat = chats.find(c => c.id === currentChatId); }

    const isGenerateText = text.toLowerCase().match(/(buatkan|bikin|tolong|web|skripsi|analisis)/) || selectedFiles.length > 0;
    if (currentMode === 'free') {
      if (chat.tipeChat === null) {
        if (isGenerateText) {
          chat.tipeChat = 'generate';
          if (limitData.generate <= 0) return showAlert("Limit Habis", 'Limit generate (7x) habis! Silakan beli Premium.');
          limitData.generate--; saveLimit();
        } else {
          chat.tipeChat = 'chat';
          if (limitData.chat <= 0) return showAlert("Limit Habis", 'Limit ngobrol (5x) habis! Silakan beli Premium.');
          limitData.chat--; saveLimit();
        }
      } else {
        if (chat.tipeChat === 'generate' && limitData.generate <= 0) return showAlert("Limit Habis", 'Limit generate lu udah habis (7x)!');
        if (chat.tipeChat === 'chat' && limitData.chat <= 0) return showAlert("Limit Habis", 'Limit ngobrol lu udah habis (5x)!');
      }
    }

    if (chat.messages.length === 0) { chat.title = text.substring(0, 25) + '...'; renderHistory(); }
    
    let imgBase64 = selectedFiles.length > 0 ? selectedFiles[0].base64 : null;
    let userContent = text;
    if (selectedFiles.length > 0) {
        userContent = [{ type: "text", text: text || "Tolong analisis gambar ini." }];
        selectedFiles.forEach(f => { userContent.push({ type: "image_url", image_url: { url: f.base64 } }); });
    }

    tambahPesanUI(text || "[Foto Terlampir]", true, null, null, imgBase64); 
    chat.messages.push({ role: 'user', text: text || "[Foto Terlampir]", content: userContent, img: imgBase64 }); saveChats();
    input.value = ''; selectedFiles = []; document.getElementById('file-preview').style.display = 'none'; input.style.height = '';

    isGenerating = true; document.getElementById('sendBtn').disabled = true;
    const loadingId = 'loading-' + Date.now();
    const box = document.getElementById('chat-box');
    const loadDiv = document.createElement('div'); loadDiv.className = 'msg msg-ai'; loadDiv.id = loadingId;
    loadDiv.innerHTML = currentMode !== 'free' ? '⚡ AI Cepat sedang memproses...' : '⏳ AI sedang berpikir...';
    box.appendChild(loadDiv); box.scrollTop = box.scrollHeight;

    try {
      const apiPayloadMessages = chat.messages.map(m => m.content ? { role: m.role, content: m.content } : { role: m.role, content: m.text });
      const response = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: imgBase64 ? 'qwen/qwen3.8-27b' : 'openai/gpt-oss-120b',
          messages: [{ role: 'system', content: 'Kamu adalah asisten AI cerdas. JIKA user minta dibuatkan website, berikan kode HTML+CSS+JS dan tambahkan cara deploy (Vercel). TAPI JIKA user minta skripsi/analisis, buatkan teks yang rapi.' }, ...apiPayloadMessages]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      const aiReply = data.choices[0].message.content;
      
      if (aiReply.includes('```html')) {
        const parts = aiReply.split('```html'); const code = parts[1].split('```')[0].trim(); const tutorial = parts[0].trim();
        tambahPesanUI(aiReply, false, code, tutorial); chat.messages.push({ role: 'assistant', text: aiReply, code: code, tutorial: tutorial });
      } else {
        tambahPesanUI(aiReply, false, null, null); chat.messages.push({ role: 'assistant', text: aiReply });
      }
      saveChats();
    } catch (err) {
      if (currentMode === 'free') { if (chat.tipeChat === 'generate') limitData.generate++; else limitData.chat++; saveLimit(); }
      document.getElementById(loadingId).innerText = '❌ Error: ' + err.message;
    } finally {
      isGenerating = false; document.getElementById('sendBtn').disabled = false;
    }
  }

  if (chats.length > 0) { muatChat(chats[0].id); } else { renderHistory(); }
  </script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Web Generator - LyzCreator</title>
<style>
  :root { --bg: #0a0c10; --panel: #12151c; --accent: #e6b450; --text: #ffffff; --border: #2a2f3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

  #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; transition: transform 0.3s; z-index: 1000; }
  @media (max-width: 768px) {
    #sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); }
    #sidebar.show { transform: translateX(0); }
  }
  .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h2 { font-size: 16px; color: var(--accent); }
  #closeSidebar { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
  @media (max-width: 768px) { #closeSidebar { display: block; } }
  .btn-new-chat { margin: 15px; padding: 10px; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-new-chat:hover { background: var(--accent); color: var(--bg); }
  
  #history-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .history-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #aaa; }
  .history-item:hover, .history-item.active { background: #1e2430; color: var(--text); }
  .btn-delete { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; display: none; }
  .history-item:hover .btn-delete, .history-item.active .btn-delete { display: block; }
  
  .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rename-input { flex: 1; background: #000; border: 1px solid var(--accent); color: white; padding: 2px 5px; border-radius: 4px; font-size: 14px; outline: none; }

  #main { flex: 1; display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden; }
  .top-bar { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; height: 56px; }
  .nav-btns { display: flex; gap: 10px; align-items: center; }
  #openSidebar { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; }
  @media (max-width: 768px) { #openSidebar { display: block; } }
  .btn-back { text-decoration: none; color: var(--accent); font-size: 14px; font-weight: bold; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; }
  
  #status-indicator { color: #28a745; font-size: 12px; font-weight: bold; padding: 5px 10px; border: 1px solid #28a745; border-radius: 6px; background: rgba(40, 167, 69, 0.1); }

  #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
  .msg-user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
  .msg-ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }
  .code-wrapper { background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 10px; overflow: hidden; }
  .code-header { background: #1a1a1a; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12px; color: #aaa; border-bottom: 1px solid #333; }
  .code-box { padding: 12px; overflow-x: auto; color: #a9b7c6; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  
  .img-preview { display: flex; gap: 10px; padding: 10px; background: #1e2430; border-bottom: 1px solid var(--border); align-items: center; }
  .img-preview img { height: 50px; border-radius: 4px; }
  .file-badge { background: var(--accent); color: black; padding: 5px 10px; border-radius: 5px; font-size: 12px; display: flex; align-items: center; gap: 5px;}

  .input-area { padding: 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; width: 100%; }
  .input-row { display: flex; gap: 10px; width: 100%; }
  #attach-btn { background: #2a2f3a; border: none; color: white; padding: 0 15px; border-radius: 8px; cursor: pointer; font-size: 18px; }
  #attach-btn:hover { background: #3a4050; }
  #chat-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; resize: none; font-size: 14px; }
  #sendBtn { padding: 0 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: bold; cursor: pointer; }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h2>History Chat</h2>
    <button id="closeSidebar" onclick="toggleSidebar()">✖</button>
  </div>
  <button class="btn-new-chat" onclick="newChat()">+ Obrolan Baru</button>
  <div id="history-list"></div>
</div>

<div id="main">
  <div class="top-bar">
    <div class="nav-btns">
      <button id="openSidebar" onclick="toggleSidebar()">☰</button>
      <a href="creator.html" class="btn-back">← Dashboard</a>
    </div>
    <span id="status-indicator">● Sistem Online</span>
  </div>

  <div id="chat-box">
    <div id="empty-state" style="text-align:center; color:#aaa; margin-top:50px;">Belum ada obrolan. Ketik pesan untuk mulai.</div>
  </div>

  <div class="input-area">
    <div id="file-preview" class="img-preview" style="display: none;">
      <img id="preview-img" src="" alt="Preview">
      <span id="file-name">file.jpg</span>
      <span onclick="hapusFile()" style="cursor:pointer; color:red; margin-left:auto;">✖</span>
    </div>
    
    <div class="input-row">
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
      <button id="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
      
      <textarea id="chat-input" rows="1" placeholder="Minta buat web / skripsi / analisis gambar di sini..." onkeydown="handleEnter(event)"></textarea>
      <button id="sendBtn" onclick="kirimPesan()">Kirim</button>
    </div>
  </div>
</div>

<script>
  let chats = JSON.parse(localStorage.getItem('groq_chats')) || [];
  let currentChatId = null;
  let isGenerating = false;
  let currentImageBase64 = null;

  const activeUser = localStorage.getItem('creator_active_user') || 'guest';
  const kuotaKey = 'lyz_creator_kuota_' + activeUser;
  
  let sisaKuota = localStorage.getItem(kuotaKey);
  if (sisaKuota === null) {
    sisaKuota = 2;
    localStorage.setItem(kuotaKey, sisaKuota);
  } else {
    sisaKuota = parseInt(sisaKuota);
  }

  function saveChats() { localStorage.setItem('groq_chats', JSON.stringify(chats)); }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

  function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
      const title = document.createElement('div');
      title.className = 'history-title';
      title.innerText = c.title;
      title.onclick = () => muatChat(c.id);
      title.ondblclick = (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'rename-input';
        input.value = c.title;
        item.replaceChild(input, title);
        input.focus();
        const saveRename = () => {
          const newTitle = input.value.trim();
          if (newTitle) { c.title = newTitle; saveChats(); }
          renderHistory();
        };
        input.onblur = saveRename;
        input.onkeydown = (e) => { if(e.key === 'Enter') saveRename(); };
      };
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.innerText = '🗑';
      delBtn.onclick = (e) => { e.stopPropagation(); hapusChat(c.id); };
      item.appendChild(title);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  function hapusChat(id) {
    if (!confirm('Hapus obrolan ini?')) return;
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) {
      currentChatId = chats.length > 0 ? chats[0].id : null;
      muatChat(currentChatId);
    } else { renderHistory(); }
  }

  function newChat() {
    if (window.innerWidth <= 768) toggleSidebar();
    const newId = Date.now().toString();
    chats.unshift({ id: newId, title: 'Obrolan Baru', messages: [] });
    saveChats();
    muatChat(newId);
  }

  function muatChat(id) {
    if (!id && chats.length > 0) id = chats[0].id;
    currentChatId = id;
    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('show');
    renderHistory();
    const box = document.getElementById('chat-box');
    box.innerHTML = '';
    const chat = chats.find(c => c.id === id);
    if (!chat) {
      box.innerHTML = '<div id="empty-state" style="text-align:center; color:#aaa; margin-top:50px;">Belum ada obrolan. Ketik pesan untuk mulai.</div>';
      return;
    }
    chat.messages.forEach(msg => tambahPesanUI(msg.text, msg.role === 'user', msg.code, msg.tutorial));
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      currentImageBase64 = e.target.result;
      document.getElementById('preview-img').src = currentImageBase64;
      document.getElementById('file-name').innerText = file.name;
      document.getElementById('file-preview').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function hapusFile() {
    currentImageBase64 = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-preview').style.display = 'none';
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      kirimPesan();
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tambahPesanUI(text, isUser, codeContent = null, tutorialText = null) {
    const box = document.getElementById('chat-box');
    const empty = document.getElementById('empty-state');
    if(empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'msg-user' : 'msg-ai');
    if (isUser) {
      div.innerText = text;
    } else {
      if (codeContent) {
        div.innerHTML = `
          <div style="margin-bottom:10px; color:#ccc;">${escapeHtml(tutorialText || '')}</div>
          <div class="code-wrapper">
            <div class="code-header">
              <span>HTML + CSS + JS</span>
              <button onclick="salinKode(this)" style="background:none;border:none;color:var(--accent);cursor:pointer;">Salin</button>
            </div>
            <div class="code-box">${escapeHtml(codeContent)}</div>
          </div>
        `;
      } else {
        div.innerText = text;
      }
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function salinKode(btn) {
    const codeText = btn.closest('.code-wrapper').querySelector('.code-box').innerText;
    navigator.clipboard.writeText(codeText).then(() => {
      btn.innerText = 'Tersalin!';
      setTimeout(() => btn.innerText = 'Salin', 2000);
    });
  }

  async function kirimPesan() {
    if (isGenerating) return;
    const input = document.getElementById('chat-input');
    let text = input.value.trim();
    if (!text && !currentImageBase64) return;
    if (sisaKuota <= 0) return alert('Waduh, kuota gratis 2x generate lu udah habis, Bily! Silakan langganan buat lanjut.');

    let chat = chats.find(c => c.id === currentChatId);
    if (!chat) { newChat(); chat = chats.find(c => c.id === currentChatId); }

    if (chat.messages.length === 0) {
      chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
      renderHistory();
    }

    let userContent = text;
    if (currentImageBase64) {
      userContent = [
        { type: "text", text: text || "Tolong analisis gambar ini." },
        { type: "image_url", image_url: { url: currentImageBase64 } }
      ];
    }

    let displayTeks = text;
    if (currentImageBase64) displayTeks += " [Gambar Terlampir]";
    if (!displayTeks) displayTeks = "[Gambar Terlampir]";
    
    tambahPesanUI(displayTeks, true);
    chat.messages.push({ role: 'user', text: displayTeks, content: userContent });
    saveChats();
    input.value = '';
    hapusFile();

    isGenerating = true;
    document.getElementById('sendBtn').disabled = true;
    sisaKuota--;
    localStorage.setItem(kuotaKey, sisaKuota);

    const loadingId = 'loading-' + Date.now();
    const box = document.getElementById('chat-box');
    const loadDiv = document.createElement('div');
    loadDiv.className = 'msg msg-ai';
    loadDiv.id = loadingId;
    loadDiv.innerHTML = '⏳ AI sedang berpikir...';
    box.appendChild(loadDiv);
    box.scrollTop = box.scrollHeight;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: currentImageBase64 ? 'meta-llama/llama-4-scout-17b-16e-instruct' : 'openai/gpt-oss-120b',
          messages: [
            { role: 'system', content: 'Kamu adalah asisten AI yang cerdas. JIKA user minta dibuatkan website, berikan kode HTML+CSS+JS, pisahkan dengan === TUTORIAL ===. JIKA user minta hal lain (skripsi/teks/analisis gambar), jawab dengan teks biasa.' },
            ...chat.messages.map(m => ({ role: m.role, content: m.content || m.text }))
          ]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const aiReply = data.choices[0].message.content;
      const parts = aiReply.split('=== TUTORIAL ===');
      const code = parts[0].replace(/```html/g, '').replace(/```/g, '').trim();
      const tutorial = parts[1] ? parts[1].trim() : null;

      document.getElementById(loadingId).remove();
      if (tutorial) {
        tambahPesanUI(aiReply, false, code, tutorial);
        chat.messages.push({ role: 'assistant', text: aiReply, code: code, tutorial: tutorial });
      } else {
        tambahPesanUI(aiReply, false, null, null);
        chat.messages.push({ role: 'assistant', text: aiReply });
      }
      saveChats();
    } catch (err) {
      sisaKuota++;
      localStorage.setItem(kuotaKey, sisaKuota);
      document.getElementById(loadingId).innerText = '❌ Error: ' + err.message;
    } finally {
      isGenerating = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  if (chats.length > 0) { muatChat(chats[0].id); } else { renderHistory(); }
</script>
</body>
  </html>

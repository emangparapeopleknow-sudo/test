<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Web Generator</title>
<style>
    :root { --bg: #0a0c10; --panel: #12151c; --accent: #e6b450; --cursor: #5fb8ff; --text: #ffffff; --ok: #4ade80; --danger: #f87171; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR KIRI */
    .chat-sidebar { width: 260px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
    .chat-sidebar h2 { font-size: 16px; padding: 20px; color: var(--accent); border-bottom: 1px solid #333; margin: 0; }
    .btn-new { margin: 15px; padding: 12px; background: rgba(230,180,80,0.2); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;}
    .btn-new:hover { background: var(--accent); color: black; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 10px; }
    .history-item { padding: 12px; margin-bottom: 5px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
    .history-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .history-item.active { background: rgba(95,184,255,0.1); border-color: var(--cursor); color: var(--cursor); }
    .btn-back { padding: 15px; border-top: 1px solid #333; text-align: center; color: #aaa; text-decoration: none; font-size: 14px; display: block;}
    .btn-back:hover { color: white; background: #1a1f2b; }

    /* AREA CHAT UTAMA */
    .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid #333; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; align-items: center;}
    .api-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;}
    .api-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .msg { max-width: 85%; padding: 15px 20px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
    .msg-user { align-self: flex-end; background: var(--cursor); color: #000; border-bottom-right-radius: 2px; }
    .msg-ai { align-self: flex-start; background: var(--panel); border: 1px solid #333; border-bottom-left-radius: 2px; width: 100%;}
    .msg-ai img, .msg-user img { max-width: 250px; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #555; }
    
    .code-wrapper { background: #000; border: 1px solid var(--accent); border-radius: 8px; margin-top: 15px; overflow: hidden; }
    .code-header { display: flex; justify-content: space-between; padding: 8px 15px; background: #1a1f2b; border-bottom: 1px solid #333; font-size: 12px; color: var(--accent); align-items: center;}
    .code-header button { background: var(--ok); color: black; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;}
    .code-box { padding: 15px; font-family: 'Consolas', monospace; font-size: 13px; white-space: pre-wrap; color: var(--ok); max-height: 300px; overflow-y: auto; }

    /* INPUT AREA */
    .input-area { padding: 15px 20px; border-top: 1px solid #333; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
    .file-preview { display: none; align-items: center; gap: 15px; background: #1a1f2b; padding: 10px 15px; border-radius: 8px; border: 1px dashed #555; font-size: 12px; }
    .file-preview img { height: 40px; border-radius: 5px; }
    
    .input-row { display: flex; gap: 10px; }
    .btn-attach { background: #1a1f2b; border: 1px solid #333; color: white; width: 50px; border-radius: 8px; cursor: pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
    .btn-attach:hover { border-color: var(--cursor); color: var(--cursor); }
    .input-row input[type="text"] { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none; font-size: 15px; }
    .btn-send { padding: 0 25px; background: var(--accent); color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;}
    .btn-send:hover { background: #c99a34; }
    
    #file-input { display: none; }

    /* MODAL API KEY */
    #api-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;}
    .modal-box { background: #12151c; padding: 30px; border-radius: 16px; border: 1px solid var(--accent); text-align: center; max-width: 400px; width: 90%; }
    .modal-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none;}
    .modal-box button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent); color: black; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;}
    .modal-box .btn-cancel { background: transparent; color: #aaa; border: 1px solid #333; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .chat-sidebar { position: fixed; left: -260px; height: 100vh; transition: 0.3s; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
        .chat-sidebar.active { left: 0; }
        .menu-toggle { display: block !important; background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 15px;}
    }
    .menu-toggle { display: none; }
</style>
</head>
<body>

    <!-- SIDEBAR HISTORY -->
    <div class="chat-sidebar" id="sidebar">
        <h2>History Chat</h2>
        <button class="btn-new" onclick="newChat()">+ Obrolan Baru</button>
        <div class="history-list" id="history-list"></div>
        <a href="creator.html" class="btn-back">← Kembali ke Dashboard</a>
    </div>

    <!-- AREA CHAT -->
    <div class="chat-main">
        <div class="chat-header">
            <div style="display:flex; align-items:center;">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>
                <span>AI Web Generator</span>
            </div>
            <button class="api-btn" id="api-status" onclick="bukaModalAPI()">Cek API Key</button>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="msg msg-ai">Halo Bily! Mau bikin web apa hari ini? Ketik prompt lu di bawah, atau kirim foto sketsa sebagai referensi.</div>
        </div>

        <div class="input-area">
            <div class="file-preview" id="file-preview">
                <img id="preview-img" src="" alt="Preview">
                <span id="preview-name">file.jpg</span>
                <span style="color: var(--danger); cursor:pointer; margin-left:auto; font-weight:bold;" onclick="hapusFile()">✕ Hapus</span>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
                <button class="btn-attach" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="text" id="chat-input" placeholder="Ketik instruksi bikin web..." onkeypress="if(event.key === 'Enter') kirimPesan()">
                <button class="btn-send" onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>

    <!-- MODAL API KEY -->
    <div id="api-modal">
        <div class="modal-box">
            <h3 style="color: var(--accent); margin-bottom: 10px;">Groq API Key</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Masukin API Key Groq lu (gsk_...) biar AI-nya jalan.</p>
            <input type="password" id="api-key-input" placeholder="gsk_...">
            <button onclick="simpanAPIKey()">Simpan Key</button>
            <button class="btn-cancel" onclick="tutupModalAPI()">Tutup</button>
        </div>
    </div>

<script>
    // ================= STATE =================
    let currentChatId = null;
    let uploadedImageBase64 = "";
    let chats = JSON.parse(localStorage.getItem('creator_chats')) || [];

    // Cek API Key dari LocalStorage
    function checkAPIStatus() {
        const key = localStorage.getItem('groq_api_key');
        const btn = document.getElementById('api-status');
        if(key) {
            btn.innerText = "✅ API Siap";
            btn.style.color = "var(--ok)";
            btn.style.borderColor = "var(--ok)";
        } else {
            btn.innerText = "⚠️ Set API Key";
            btn.style.color = "var(--accent)";
            btn.style.borderColor = "var(--accent)";
        }
    }

    window.onload = function() {
        checkAPIStatus();
        if(chats.length > 0) {
            muatChat(chats[0].id);
        } else {
            newChat(); // Bikin obrolan baru otomatis kalo belum ada
        }
    }

    // ================= LOGIKA API KEY =================
    function bukaModalAPI() {
        const savedKey = localStorage.getItem('groq_api_key');
        if(savedKey) document.getElementById('api-key-input').value = savedKey;
        document.getElementById('api-modal').style.display = 'flex';
    }
    function tutupModalAPI() {
        document.getElementById('api-modal').style.display = 'none';
    }
    function simpanAPIKey() {
        const key = document.getElementById('api-key-input').value.trim();
        if(!key.startsWith('gsk_')) return alert("Format API Key salah (harusnya gsk_...)");
        localStorage.setItem('groq_api_key', key);
        checkAPIStatus();
        tutupModalAPI();
        alert("API Key disimpan!");
    }

    // ================= LOGIKA HISTORY =================
    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        chats.forEach(c => {
            let item = document.createElement('div');
            item.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
            item.innerText = c.title;
            item.onclick = () => muatChat(c.id);
            list.appendChild(item);
        });
    }

    function newChat() {
        const newId = Date.now().toString();
        chats.unshift({ id: newId, title: "Obrolan Baru", messages: [] });
        saveChats();
        muatChat(newId);
    }

    function muatChat(id) {
        currentChatId = id;
        renderHistory();
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        const chat = chats.find(c => c.id === id);
        
        if(chat.messages.length === 0) {
            box.innerHTML = '<div class="msg msg-ai">Halo Bily! Mau bikin web apa hari ini? Ketik prompt lu di bawah, atau kirim foto sketsa sebagai referensi.</div>';
        } else {
            chat.messages.forEach(m => {
                if(m.role === 'user') tambahPesanUI(m.content, true, m.image);
                else tambahPesanUI(m.content, false, null, m.code, m.tutorial);
            });
        }
        box.scrollTop = box.scrollHeight;
    }

    function saveChats() {
        localStorage.setItem('creator_chats', JSON.stringify(chats));
    }

    // ================= LOGIKA UPLOAD GAMBAR =================
    function handleFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 2 * 1024 * 1024) return alert("Maksimal 2MB!");

        const reader = new FileReader();
        reader.onload = function(ev) {
            uploadedImageBase64 = ev.target.result;
            document.getElementById('preview-img').src = uploadedImageBase64;
            document.getElementById('preview-name').innerText = file.name;
            document.getElementById('file-preview').style.display = 'flex';
        }
        reader.readAsDataURL(file);
    }

    function hapusFile() {
        uploadedImageBase64 = "";
        document.getElementById('file-input').value = "";
        document.getElementById('file-preview').style.display = 'none';
    }

    // ================= LOGIKA KIRIM PESAN =================
    async function kirimPesan() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        const key = localStorage.getItem('groq_api_key');

        if(!key) return alert("Set API Key dulu lewat tombol di pojok kanan atas!");
        if(!text && !uploadedImageBase64) return;

        // 1. Tampilkan di UI
        tambahPesanUI(text || "(Mengirim gambar)", true, uploadedImageBase64);
        
        // 2. Simpan ke History (Teks & Gambar)
        const chat = chats.find(c => c.id === currentChatId);
        if(chat.messages.length === 0) {
            chat.title = text.substring(0, 25) || "Sketsa Gambar";
        }
        chat.messages.push({ role: "user", content: text, image: uploadedImageBase64 });
        saveChats();
        renderHistory();

        // 3. Reset Input
        const imgTemp = uploadedImageBase64; // Simpan sementara buat API
        input.value = "";
        hapusFile();
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;

        // 4. Tampilkan Loading
        const loadingId = "load-" + Date.now();
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="msg msg-ai" id="${loadingId}">AI lagi mikir... (Bikin kode)</div>`;
        box.scrollTop = box.scrollHeight;

        // 5. Nembak API Groq
        try {
            const sysPrompt = `Kamu adalah expert web developer. Buat kode web HTML+CSS+JS dalam 1 file berdasarkan prompt user. Kalo user kirim gambar, jadikan referensi desain. Keluarkan HANYA kode HTML utuh (tanpa markdown). Di akhir tambahkan "=== TUTORIAL ===" lalu ketik: "Web berhasil dibuat! Tonton video tutorial dari Bily di link berikut: [LINK_YOUTUBE]".`;

            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: sysPrompt },
                        { role: "user", content: text + (imgTemp ? " (User melampirkan gambar sebagai referensi desain)" : "") }
                    ],
                    temperature: 0.7
                })
            });

            const data = await res.json();
            if(data.error) throw new Error(data.error.message);

            let aiReply = data.choices[0].message.content;
            let parts = aiReply.split("=== TUTORIAL ===");
            let code = parts[0].replace(/\`\`\`html/g, '').replace(/\`\`\`/g, '').trim();
            let tutor = parts[1] ? parts[1].trim() : "Gagal memuat tutorial.";

            // Hapus loading, tampilkan hasil
            document.getElementById(loadingId).remove();
            tambahPesanUI(aiReply, false, null, code, tutor);

            // Simpan ke History
            chat.messages.push({ role: "ai", content: aiReply, code: code, tutorial: tutor });
            saveChats();

        } catch(err) {
            document.getElementById(loadingId).innerText = "Error: " + err.message;
        }
    }

    // ================= RENDER UI CHAT =================
    function tambahPesanUI(text, isUser, imgBase64, codeContent, tutorialText) {
        const box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = isUser ? 'msg msg-user' : 'msg msg-ai';
        
        if(isUser) {
            div.innerText = text;
            if(imgBase64) {
                let img = document.createElement('img');
                img.src = imgBase64;
                div.appendChild(img);
            }
        } else {
            if(codeContent) {
                div.innerHTML = `
                    <div style="margin-bottom:10px; color:#aaa;">${tutorialText}</div>
                    <div class="code-wrapper">
                        <div class="code-header">
                            <span>HTML + CSS + JS</span>
                            <button onclick="salinKode(this)">Salin</button>
                        </div>
                        <div class="code-box">${escapeHtml(codeContent)}</div>
                    </div>
                `;
            } else {
                div.innerText = text;
            }
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function salinKode(btn) {
        const codeText = btn.closest('.code-wrapper').querySelector('.code-box').innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            btn.innerText = "Tersalin!";
            setTimeout(() => btn.innerText = "Salin", 2000);
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #070b14;
        --card-bg: #111625;
        --card-border: #232c45;
        --primary: #7f5af0;
        --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%);
        --text-main: #ffffff;
        --text-muted: #8b94b0;
        --input-bg: #1a2035;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: var(--bg-dark);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .header-icon {
        font-size: 22px;
        cursor: pointer;
        color: var(--text-main);
    }

    .header-right {
        display: flex;
        gap: 20px;
    }

    .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
    }

    .logo-center {
        width: 60px;
        height: 60px;
        background: var(--primary-grad);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 900;
        color: #fff;
        margin-bottom: 20px;
        box-shadow: 0 0 30px rgba(127, 90, 240, 0.4);
    }

    .greeting {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
    }

    .bottom-area {
        padding: 15px 20px 30px;
        background: var(--bg-dark);
        z-index: 10;
    }

    .input-box {
        background: var(--input-bg);
        border: 1px solid var(--card-border);
        border-radius: 25px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .input-box input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-main);
        font-size: 15px;
        width: 100%;
    }

    .input-box input::placeholder {
        color: var(--text-muted);
    }

    .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .action-toggles {
        display: flex;
        gap: 10px;
    }

    .toggle-btn {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
    }

    .toggle-btn.active {
        border-color: var(--primary);
        color: var(--primary);
        background: rgba(127, 90, 240, 0.1);
    }

    .right-actions {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .btn-icon {
        background: transparent;
        border: none;
        color: var(--text-main);
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

        .bottom-sheet {
        position: fixed;
        bottom: -100%;
        left: 0;
        width: 100%;
        background: var(--bg-dark);
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        padding: 20px;
        z-index: 200;
        transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-top: 1px solid var(--card-border);
    }

    .bottom-sheet.active {
        bottom: 0;
    }

    .sheet-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 150;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
    }

    .sheet-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .carousel {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 20px;
        margin-bottom: 10px;
    }

    .carousel::-webkit-scrollbar {
        display: none;
    }

    .carousel-item {
        min-width: 100px;
        height: 100px;
        background: var(--card-bg);
        border-radius: 15px;
        border: 1px solid var(--card-border);
        flex-shrink: 0;
    }

    .upload-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .upload-card {
        background: #2c2c2e;
        border-radius: 20px;
        padding: 25px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
    }

    .upload-card span.icon {
        font-size: 28px;
        color: var(--text-main);
    }

    .upload-card span.text {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
    }
</style>
</head>
<body>

  <div class="header">
    <div class="header-icon" onclick="window.location.href='creator.html'">☰</div>
    <div class="header-right">
        <div class="header-icon">🔇</div>
        <div class="header-icon">💬</div>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="logo-center">L</div>
    <h2 class="greeting" id="greetingText">Selamat siang. Ada yang bisa saya bantu?</h2>
</div>

<div class="bottom-area">
    <div class="input-box">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau tahan untuk bicara">
        <div class="input-actions">
            <div class="action-toggles">
                <button class="toggle-btn" onclick="toggleAction(this)">⚛️ Berpikir</button>
                <button class="toggle-btn" onclick="toggleAction(this)">🌐 Cari</button>
            </div>
            <div class="right-actions">
                <button class="btn-icon" onclick="openSheet()">⊕</button>
                <button class="btn-icon">🔊</button>
            </div>
        </div>
    </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="bottomSheet">
    <div class="carousel">
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
        <div class="carousel-item"></div>
    </div>
    <div class="upload-options">
        <div class="upload-card">
            <span class="icon">📷</span>
            <span class="text">Kamera</span>
        </div>
        <div class="upload-card">
            <span class="icon">🖼️</span>
            <span class="text">Album</span>
        </div>
        <div class="upload-card">
            <span class="icon">📎</span>
            <span class="text">Dokumen</span>
        </div>
    </div>
</div>

  <script>
    const hour = new Date().getHours();
    const greetingText = document.getElementById('greetingText');
    
    if (hour < 11) {
        greetingText.innerText = "Selamat pagi. Ada yang bisa saya bantu?";
    } else if (hour < 15) {
        greetingText.innerText = "Selamat siang. Ada yang bisa saya bantu?";
    } else if (hour < 18) {
        greetingText.innerText = "Selamat sore. Ada yang bisa saya bantu?";
    } else {
        greetingText.innerText = "Selamat malam. Ada yang bisa saya bantu?";
    }

    function toggleAction(btn) {
        btn.classList.toggle('active');
    }

    function openSheet() {
        document.getElementById('bottomSheet').classList.add('active');
        document.getElementById('sheetOverlay').classList.add('active');
    }

    function closeSheet() {
        document.getElementById('bottomSheet').classList.remove('active');
        document.getElementById('sheetOverlay').classList.remove('active');
    }

    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && chatInput.value.trim() !== '') {
            document.getElementById('chatContainer').style.justifyContent = 'flex-start';
            greetingText.style.display = 'none';
            
            const userBubble = document.createElement('div');
            userBubble.style.cssText = "align-self: flex-end; background: var(--primary); padding: 12px 18px; border-radius: 20px 20px 5px 20px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
            userBubble.innerText = chatInput.value;
            document.getElementById('chatContainer').appendChild(userBubble);
            
            chatInput.value = '';
            
            setTimeout(() => {
                const aiBubble = document.createElement('div');
                aiBubble.style.cssText = "align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 18px; border-radius: 20px 20px 20px 5px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
                aiBubble.innerText = "Ini adalah respons simulasi. Sambungkan ke api/chat.js untuk hasil nyata.";
                document.getElementById('chatContainer').appendChild(aiBubble);
            }, 1000);
        }
    });
</script>

</body>
</html>

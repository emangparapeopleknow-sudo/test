<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Web Generator</title>
<style>
  :root { --bg: #0a0c10; --panel: #12151c; --accent: #e6b450; --text: #ffffff; --border: #2a2f3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* SIDEBAR */
  #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; transition: transform 0.3s; z-index: 1000; }
  @media (max-width: 768px) {
    #sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); }
    #sidebar.show { transform: translateX(0); }
  }
  .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h2 { font-size: 16px; color: var(--accent); }
  #closeSidebar { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
  @media (max-width: 768px) { #closeSidebar { display: block; } }
  .btn-new-chat { margin: 15px; padding: 10px; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-new-chat:hover { background: var(--accent); color: var(--bg); }
  #history-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .history-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #aaa; }
  .history-item:hover, .history-item.active { background: #1e2430; color: var(--text); }
  .btn-delete { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; display: none; }
  .history-item:hover .btn-delete, .history-item.active .btn-delete { display: block; }

  /* MAIN CHAT */
  #main { flex: 1; display: flex; flex-direction: column; position: relative; height: 100vh; width: 100%; overflow: hidden; }
  .top-bar { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; height: 56px; }
  #openSidebar { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; }
  @media (max-width: 768px) { #openSidebar { display: block; } }
  #apiStatusBtn { padding: 8px 12px; border-radius: 6px; border: 1px solid #28a745; color: #28a745; background: rgba(40, 167, 69, 0.1); cursor: pointer; font-size: 12px; font-weight: bold; }
  #apiStatusBtn.error { border-color: #dc3545; color: #dc3545; background: rgba(220, 53, 69, 0.1); }

  /* CHAT BOX DENGAN PADDING BOTTOM BUAT INPUT */
  #chat-box { 
    flex: 1; 
    padding: 20px 20px 80px 20px; /* Padding bawah 80px biar ga ketutupan input */
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
  .msg-user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
  .msg-ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }
  .code-wrapper { background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 10px; overflow: hidden; }
  .code-header { background: #1a1a1a; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12px; color: #aaa; border-bottom: 1px solid #333; }
  .code-box { padding: 12px; overflow-x: auto; color: #a9b7c6; font-family: monospace; font-size: 13px; white-space: pre-wrap; }

  /* INPUT AREA DI-FIX POSITION DI Bawah */
  .input-area { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    padding: 15px; 
    background: var(--panel); 
    border-top: 1px solid var(--border); 
    display: flex; 
    gap: 10px; 
    z-index: 10;
  }
  #chat-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; resize: none; font-size: 14px; }
  #sendBtn { padding: 0 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: bold; cursor: pointer; }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* MODAL */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
  .modal-content { background: var(--panel); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
  .modal-content h3 { margin-bottom: 15px; font-size: 16px; }
  .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 6px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn-cancel { background: transparent; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
  .btn-save { background: var(--accent); color: var(--bg); border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <h2>History Chat</h2>
    <button id="closeSidebar" onclick="toggleSidebar()">✖</button>
  </div>
  <button class="btn-new-chat" onclick="newChat()">+ Obrolan Baru</button>
  <div id="history-list"></div>
</div>

<!-- MAIN CHAT -->
<div id="main">
  <div class="top-bar">
    <button id="openSidebar" onclick="toggleSidebar()">☰</button>
    <span style="font-weight: bold;">AI Web Generator</span>
    <button id="apiStatusBtn" onclick="bukaModalAPI()">Set API Key</button>
  </div>

  <!-- CHAT BOX -->
  <div id="chat-box">
    <div id="empty-state" style="text-align:center; color:#aaa; margin-top:50px;">Belum ada obrolan. Ketik pesan untuk mulai.</div>
  </div>

  <!-- INPUT AREA (FIXED) -->
  <div class="input-area">
    <textarea id="chat-input" rows="1" placeholder="Minta buat web di sini..." onkeydown="handleEnter(event)"></textarea>
    <button id="sendBtn" onclick="kirimPesan()">Kirim</button>
  </div>
</div>

<!-- MODAL API -->
<div id="api-modal" class="modal">
  <div class="modal-content">
    <h3>Set API Key Groq</h3>
    <input type="password" id="api-key-input" placeholder="gsk_...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="tutupModalAPI()">Batal</button>
      <button class="btn-save" onclick="simpanAPIKey()">Simpan</button>
    </div>
  </div>
</div>

<script>
  let chats = JSON.parse(localStorage.getItem('groq_chats')) || [];
  let currentChatId = null;
  let isGenerating = false;

  function saveChats() { localStorage.setItem('groq_chats', JSON.stringify(chats)); }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

  function checkAPIStatus() {
    const key = localStorage.getItem('groq_api_key');
    const btn = document.getElementById('apiStatusBtn');
    if (key && key.startsWith('gsk_')) {
      btn.innerText = '✅ API Siap';
      btn.classList.remove('error');
    } else {
      btn.innerText = '⚠️ Set API Key';
      btn.classList.add('error');
    }
  }

  function bukaModalAPI() {
    const key = localStorage.getItem('groq_api_key');
    if (key) document.getElementById('api-key-input').value = key;
    document.getElementById('api-modal').style.display = 'flex';
  }

  function tutupModalAPI() { document.getElementById('api-modal').style.display = 'none'; }

  function simpanAPIKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key.startsWith('gsk_')) return alert('Format API Key salah!');
    localStorage.setItem('groq_api_key', key);
    checkAPIStatus();
    tutupModalAPI();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
      const title = document.createElement('span');
      title.innerText = c.title;
      title.style.flex = '1'; title.style.overflow = 'hidden'; title.style.textOverflow = 'ellipsis'; title.style.whiteSpace = 'nowrap';
      title.onclick = () => muatChat(c.id);
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.innerText = '🗑';
      delBtn.onclick = (e) => { e.stopPropagation(); hapusChat(c.id); };
      item.appendChild(title);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  function hapusChat(id) {
    if (!confirm('Hapus obrolan ini?')) return;
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) {
      currentChatId = chats.length > 0 ? chats[0].id : null;
      muatChat(currentChatId);
    } else { renderHistory(); }
  }

  function newChat() {
    if (window.innerWidth <= 768) toggleSidebar();
    const newId = Date.now().toString();
    chats.unshift({ id: newId, title: 'Obrolan Baru', messages: [] });
    saveChats();
    muatChat(newId);
  }

  function muatChat(id) {
    if (!id && chats.length > 0) id = chats[0].id;
    currentChatId = id;
    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('show');
    renderHistory();
    const box = document.getElementById('chat-box');
    box.innerHTML = '';
    const chat = chats.find(c => c.id === id);
    if (!chat) {
      box.innerHTML = '<div id="empty-state" style="text-align:center; color:#aaa; margin-top:50px;">Belum ada obrolan. Ketik pesan untuk mulai.</div>';
      return;
    }
    chat.messages.forEach(msg => tambahPesanUI(msg.text, msg.role === 'user', msg.code, msg.tutorial));
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      kirimPesan();
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tambahPesanUI(text, isUser, codeContent = null, tutorialText = null) {
    const box = document.getElementById('chat-box');
    const empty = document.getElementById('empty-state');
    if(empty) empty.remove();
    
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'msg-user' : 'msg-ai');

    if (isUser) {
      div.innerText = text;
    } else {
      if (codeContent) {
        div.innerHTML = `
          <div style="margin-bottom:10px; color:#ccc;">${escapeHtml(tutorialText || '')}</div>
          <div class="code-wrapper">
            <div class="code-header">
              <span>HTML + CSS + JS</span>
              <button onclick="salinKode(this)" style="background:none;border:none;color:var(--accent);cursor:pointer;">Salin</button>
            </div>
            <div class="code-box">${escapeHtml(codeContent)}</div>
          </div>
        `;
      } else {
        div.innerText = text;
      }
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function salinKode(btn) {
    const codeText = btn.closest('.code-wrapper').querySelector('.code-box').innerText;
    navigator.clipboard.writeText(codeText).then(() => {
      btn.innerText = 'Tersalin!';
      setTimeout(() => btn.innerText = 'Salin', 2000);
    });
  }

  async function kirimPesan() {
    if (isGenerating) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    const apiKey = localStorage.getItem('groq_api_key');
    if (!apiKey) return alert('Set API Key Groq dulu!');

    let chat = chats.find(c => c.id === currentChatId);
    if (!chat) { newChat(); chat = chats.find(c => c.id === currentChatId); }

    if (chat.messages.length === 0) {
      chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
      renderHistory();
    }

    tambahPesanUI(text, true);
    chat.messages.push({ role: 'user', text: text });
    saveChats();
    input.value = '';

    isGenerating = true;
    document.getElementById('sendBtn').disabled = true;

    const loadingId = 'loading-' + Date.now();
    const box = document.getElementById('chat-box');
    const loadDiv = document.createElement('div');
    loadDiv.className = 'msg msg-ai';
    loadDiv.id = loadingId;
    loadDiv.innerHTML = '⏳ AI sedang berpikir...';
    box.appendChild(loadDiv);
    box.scrollTop = box.scrollHeight;

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama3-70b-8192',
          messages: [
            { role: 'system', content: 'Kamu adalah web developer expert. Jika user minta dibuatkan web, berikan kode lengkap HTML+CSS+JS dalam satu blok kode. Pisahkan kode dengan penanda === TUTORIAL === diikuti penjelasan singkat.' },
            ...chat.messages.map(m => ({ role: m.role, content: m.text }))
          ]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const aiReply = data.choices[0].message.content;
      const parts = aiReply.split('=== TUTORIAL ===');
      const code = parts[0].replace(/```html/g, '').replace(/```/g, '').trim();
      const tutorial = parts[1] ? parts[1].trim() : 'Berikut kodenya:';

      document.getElementById(loadingId).remove();
      tambahPesanUI(aiReply, false, code !== aiReply ? code : null, tutorial);
      
      chat.messages.push({ role: 'assistant', text: aiReply, code: code !== aiReply ? code : null, tutorial: tutorial });
      saveChats();

    } catch (err) {
      document.getElementById(loadingId).innerText = '❌ Error: ' + err.message;
    } finally {
      isGenerating = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  checkAPIStatus();
  if (chats.length > 0) { muatChat(chats[0].id); } else { renderHistory(); }
</script>
</body>
</html>

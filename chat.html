<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg-dark: #070b14; --card-bg: #111625; --card-border: #232c45; --primary: #7f5af0; --text-main: #ffffff; --text-muted: #8b94b0; --input-bg: #1a2035; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-dark); position: sticky; top: 0; z-index: 10; }
    .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
    .header-icon { cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; transition: color 0.2s; }
    .header-icon:hover { color: var(--primary); }
    
    .model-selector { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; color: var(--text-main); cursor: pointer; position: relative; padding: 5px 10px; border-radius: 8px; }
    .model-selector:hover { background: rgba(255,255,255,0.05); }
    .model-dropdown { position: absolute; top: 40px; left: 0; background: #1e1f24; border: 1px solid var(--card-border); border-radius: 12px; width: 240px; padding: 10px; display: none; flex-direction: column; gap: 5px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .model-dropdown.active { display: flex; }
    .model-item { padding: 10px; border-radius: 8px; font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
    .model-item:hover { background: #2a2b30; color: #fff; }
    .model-item.locked { opacity: 0.5; cursor: not-allowed; }
    .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .custom-alert-overlay.active { opacity: 1; visibility: visible; }
    .custom-alert-box { background: #23252b; border: 1px solid #333; border-radius: 20px; padding: 25px; width: 85%; max-width: 350px; text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .custom-alert-overlay.active .custom-alert-box { transform: scale(1); }
    .custom-alert-box h3 { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .custom-alert-box p { color: #8b94b0; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .custom-alert-btn { background: transparent; border: none; color: #3b82f6; font-size: 16px; font-weight: 600; cursor: pointer; padding: 10px; }
</style>
<style>
    .chat-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; padding-bottom: 20px; }
    .logo-center { width: 60px; height: 60px; background: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #fff; margin-bottom: 20px; box-shadow: 0 0 30px rgba(127, 90, 240, 0.4); }
    .greeting { font-size: 20px; font-weight: 700; text-align: center; color: var(--text-main); }
    
    .bottom-area { padding: 15px 20px 30px; background: var(--bg-dark); z-index: 10; width: 100%; }
    .input-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 25px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .input-box input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; width: 100%; }
    .input-box input::placeholder { color: var(--text-muted); }
    
    .input-actions { display: flex; justify-content: space-between; align-items: center; }
    .action-toggles { display: flex; gap: 10px; }
    .toggle-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .right-actions { display: flex; gap: 15px; align-items: center; }
    .btn-icon { background: transparent; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
    
    .btn-upgrade { padding: 8px 15px; font-size: 12px; width: auto; border-radius: 20px; background: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); border: none; color: #fff; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
</style>
</head>
<body>
    <div class="header">
    <div class="header-left">
        <div class="header-icon" onclick="showAlert('Info', 'Fitur riwayat chat akan segera hadir!')">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        
        <div class="model-selector" onclick="toggleDropdown()">
            Lyz AI Mode
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
            
            <div class="model-dropdown" id="modelDropdown">
                <div class="model-item" onclick="selectModel('Lyz AI - Pro')">Pro Mode <span>✓</span></div>
                <div class="model-item locked" onclick="showAlert('Akses Ditolak', 'Beli VIP dulu untuk membuka mode ini!')">VIP Mode 🔒</div>
                <div class="model-item locked" onclick="showAlert('Akses Ditolak', 'Beli VVIP dulu untuk membuka mode ini!')">VVIP Mode 🔒</div>
                <div class="model-item locked" onclick="showAlert('Akses Ditolak', 'Beli Super VIP dulu untuk membuka mode ini!')">Super VIP 🔒</div>
                <div class="model-item locked" onclick="showAlert('Akses Ditolak', 'Beli Super VVIP dulu untuk membuka mode ini!')">Super VVIP 🔒</div>
                <div class="model-item locked" onclick="showAlert('Akses Ditolak', 'Beli VVIP KING dulu untuk membuka mode ini!')">VVIP King 👑🔒</div>
            </div>
        </div>
    </div>
    
    <div class="header-right">
        <div class="header-icon" onclick="toggleTTS()" id="ttsBtn" title="Text to Speech">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </div>
        <div class="header-icon" onclick="newChat()" title="Chat Baru">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="10" x2="15" y2="10"></line><line x1="12" y1="7" x2="12" y2="13"></line></svg>
        </div>
        <button class="btn-upgrade" onclick="window.location.href='premium.html'">Upgrade</button>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="logo-center">L</div>
    <h2 class="greeting" id="greetingText">Selamat malam. Ada yang bisa saya bantu?</h2>
</div>

<div class="bottom-area">
    <div class="input-box">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau tahan untuk bicara">
        <div class="input-actions">
            <div class="action-toggles">
                <button class="toggle-btn">🧠 Berpikir</button>
                <button class="toggle-btn">🌐 Cari</button>
            </div>
            <div class="right-actions">
                <button class="btn-icon" onclick="showAlert('Upload', 'Fitur upload file akan segera hadir!')">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
                <button class="btn-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
            </div>
        </div>
    </div>
</div>
<script src="alert.js"></script>
<script>
    let ttsEnabled = false;
    function toggleTTS() {
        ttsEnabled = !ttsEnabled;
        const btn = document.getElementById('ttsBtn');
        btn.style.color = ttsEnabled ? 'var(--primary)' : 'var(--text-main)';
        if (!ttsEnabled) window.speechSynthesis.cancel();
    }
    function speakText(text) {
        if (!ttsEnabled) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
    function newChat() {
        const container = document.getElementById('chatContainer');
        container.innerHTML = `<div class="logo-center">L</div><h2 class="greeting" id="greetingText">Ada yang bisa saya bantu?</h2>`;
        container.style.justifyContent = 'center';
        document.getElementById('chatInput').value = '';
        window.speechSynthesis.cancel();
    }
    function toggleDropdown() { document.getElementById('modelDropdown').classList.toggle('active'); }
    function selectModel(name) {
        document.querySelector('.model-selector').childNodes[0].nodeValue = name + " ";
        document.getElementById('modelDropdown').classList.remove('active');
    }
    window.onclick = function(event) {
        if (!event.target.closest('.model-selector')) document.getElementById('modelDropdown').classList.remove('active');
    }
    
    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && chatInput.value.trim() !== '') {
            const container = document.getElementById('chatContainer');
            container.style.justifyContent = 'flex-start';
            const greeting = document.getElementById('greetingText');
            if(greeting) greeting.style.display = 'none';
            const logo = document.querySelector('.logo-center');
            if(logo) logo.style.display = 'none';
            const userBubble = document.createElement('div');
            userBubble.style.cssText = "align-self: flex-end; background: var(--primary); padding: 12px 18px; border-radius: 20px 20px 5px 20px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
            userBubble.innerText = chatInput.value;
            container.appendChild(userBubble);
            chatInput.value = '';
            setTimeout(() => {
                const aiText = "Ini adalah respons simulasi. Sambungkan ke api/chat.js untuk hasil nyata.";
                const aiBubble = document.createElement('div');
                aiBubble.style.cssText = "align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 18px; border-radius: 20px 20px 20px 5px; margin-bottom: 10px; max-width: 80%; color: white; font-size: 14px;";
                aiBubble.innerText = aiText;
                container.appendChild(aiBubble);
                speakText(aiText);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }
    });
</script>
</body>
</html>

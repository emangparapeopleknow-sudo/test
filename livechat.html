<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Live Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg-dark: #070b14; --primary: #3b82f6; --text-main: #ffffff; --text-muted: #8b94b0; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; padding: 15px 20px; background: #111625; border-bottom: 1px solid #232c45; gap: 15px; }
    .btn-back { color: #fff; text-decoration: none; font-size: 20px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .status h4 { font-size: 15px; margin-bottom: 2px; }
    .status p { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 5px; }
    .status p::before { content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; }
    .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; position: relative; }
    .bubble.left { background: #232c45; align-self: flex-start; border-bottom-left-radius: 2px; }
    .bubble.right { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 2px; }
    .time { font-size: 10px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 5px; display: block; }
    .input-area { padding: 15px 20px; background: #111625; border-top: 1px solid #232c45; display: flex; align-items: center; gap: 10px; }
    .input-box { flex: 1; background: #1a2035; border: 1px solid #232c45; border-radius: 25px; padding: 10px 15px; display: flex; align-items: center; }
    .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; }
    .btn-send { background: #3b82f6; border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="header">
    <a href="creator.html" class="btn-back">←</a>
    <div class="avatar">CS</div>
    <div class="status"><h4>Live Chat</h4><p>Online</p></div>
</div>
<div class="chat-area" id="chatArea">
    <div class="bubble left">Halo! Ada yang bisa saya bantu? Silakan ketik pertanyaan atau kendala kamu.</div>
</div>
<div class="input-area">
    <div class="input-box"><input type="text" id="chatInput" placeholder="Tulis pesan..."></div>
    <button class="btn-send" onclick="kirimPesan()">➤</button>
</div>
<script>
    function kirimPesan() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        const chatArea = document.getElementById('chatArea');
        const now = new Date();
        const timeStr = now.getHours() + ':' + now.getMinutes().toString().padStart(2, '0');
        
        chatArea.innerHTML += `<div class="bubble right">${text} <span class="time">${timeStr}</span></div>`;
        input.value = '';
        chatArea.scrollTop = chatArea.scrollHeight;

        setTimeout(() => {
            chatArea.innerHTML += `<div class="bubble left">Pesan kamu sudah diterima. Admin akan segera membalas. <span class="time">${timeStr}</span></div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 1500);
    }
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') kirimPesan();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Customer Service</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { 
        --bg-dark: #070b14; 
        --card-bg: #111625; 
        --card-border: #232c45; 
        --primary: #7f5af0; 
        --text-main: #ffffff; 
        --text-muted: #8b94b0; 
        --telegram: #229ED9;
        --instagram: #E1306C;
        --tiktok: #000000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    .container { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .icon-header { width: 80px; height: 80px; background: rgba(127, 90, 240, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--primary); }
    .icon-header svg { width: 40px; height: 40px; stroke: currentColor; stroke-width: 2; fill: none; }
    
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; }
    
    .btn-group { display: flex; flex-direction: column; gap: 15px; }
    
    .btn-contact { 
        display: flex; align-items: center; justify-content: center; gap: 10px; 
        padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; 
        text-decoration: none; color: #fff; transition: transform 0.2s;
    }
    .btn-contact:active { transform: scale(0.98); }
    .btn-contact svg { width: 24px; height: 24px; fill: currentColor; }
    
    .btn-telegram { background: var(--telegram); }
    .btn-instagram { background: var(--instagram); }
    .btn-tiktok { background: var(--tiktok); border: 1px solid var(--card-border); }
    
    .back-link { display: inline-block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    .back-link:hover { color: var(--primary); }
</style>
</head>

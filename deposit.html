<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Deposit Saldo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg-dark: #070b14; --card-bg: #111625; --card-border: #232c45; --primary: #7f5af0; --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); --text-main: #ffffff; --text-muted: #8b94b0; --success: #00e676; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-dark); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: 800; font-size: 20px; color: #fff; }
    
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    
    .header-payment { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); margin-bottom: 20px; }
    .header-payment-left { display: flex; align-items: center; gap: 12px; }
    .icon-box { width: 45px; height: 45px; background: var(--primary-grad); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .header-payment-left h3 { font-size: 16px; font-weight: 700; line-height: 1.2; }
    
    .section-title { text-align: center; margin-bottom: 20px; }
    .section-title h2 { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
    .section-title p { font-size: 12px; color: var(--text-muted); }
    
    .nominal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .nominal-item { background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 12px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .nominal-item:hover { border-color: var(--primary); }
    .nominal-item.active { border-color: var(--primary); background: rgba(127, 90, 240, 0.1); }
    .nominal-item h4 { font-size: 14px; font-weight: 700; }
    
    .input-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .input-label-row label { font-size: 13px; font-weight: 700; }
    .limit-badge { font-size: 10px; color: var(--text-muted); background: var(--bg-dark); border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 6px; }
    .input-wrapper { display: flex; align-items: center; background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; }
    .input-wrapper span { font-size: 16px; font-weight: 700; color: var(--text-muted); margin-right: 10px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 16px; font-weight: 600; }
    
    .btn-submit { width: 100%; padding: 16px; background: var(--primary-grad); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 20px; }
    
    /* Navbar Bawah */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(17, 22, 37, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0 15px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #8b94b0; text-decoration: none; font-size: 11px; font-weight: 600; }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active { color: #7f5af0; }
    
    .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .custom-alert-overlay.active { opacity: 1; visibility: visible; }
    .custom-alert-box { background: #23252b; border: 1px solid #333; border-radius: 20px; padding: 25px; width: 85%; max-width: 350px; text-align: center; }
    .custom-alert-btn { background: transparent; border: none; color: #3b82f6; font-size: 16px; font-weight: 600; cursor: pointer; padding: 10px; }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">LyzCreator</div>
</div>

<div class="container">
    <div class="card">
        <div class="header-payment">
            <div class="header-payment-left">
                <div class="icon-box">🏦</div>
                <h3>Payment<br>Deposit</h3>
            </div>
            <a href="creator.html" style="color: var(--text-muted); text-decoration: none; font-size: 20px;">✕</a>
        </div>

        <div class="section-title">
            <h2>Masukan Nominal</h2>
            <p>Masukan nominal deposit yang diinginkan</p>
        </div>

        <div class="nominal-grid">
            <div class="nominal-item" onclick="selectNominal(this, 5000)"><h4>Rp5.000</h4></div>
            <div class="nominal-item" onclick="selectNominal(this, 10000)"><h4>Rp10.000</h4></div>
            <div class="nominal-item" onclick="selectNominal(this, 20000)"><h4>Rp20.000</h4></div>
            <div class="nominal-item" onclick="selectNominal(this, 50000)"><h4>Rp50.000</h4></div>
            <div class="nominal-item" onclick="selectNominal(this, 100000)"><h4>Rp100.000</h4></div>
            <div class="nominal-item" onclick="selectNominal(this, 200000)"><h4>Rp200.000</h4></div>
        </div>

        <div class="input-label-row">
            <label>Masukan nominal</label>
            <span class="limit-badge">MIN RP 5.000 | MAX RP 1.000.000</span>
        </div>
        
        <div class="input-wrapper">
            <span>Rp</span>
            <input type="number" id="input-nominal" placeholder="Masukkan nominal" oninput="handleManualInput(this)">
        </div>
    </div>
    
    <button class="btn-submit" onclick="lanjutkan()">Lanjutkan ke Pembayaran ›</button>
</div>

<div class="bottom-nav">
    <a href="creator.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span>
    </a>
    <a href="history.html" class="nav-item">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg><span>Riwayat</span>
    </a>
    <a href="deposit.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg><span>Deposit</span>
    </a>
    <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg><span>CS</span>
    </a>
    <a href="profil.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profil</span>
    </a>
</div>

<script src="alert.js"></script>
<script>
    function selectNominal(element, value) {
        document.querySelectorAll('.nominal-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('input-nominal').value = value;
    }
    function handleManualInput(input) {
        document.querySelectorAll('.nominal-item').forEach(el => el.classList.remove('active'));
    }

    function lanjutkan() {
        const nominal = parseInt(document.getElementById('input-nominal').value);
        
        if (!nominal || nominal < 5000) { showAlert('Gagal', 'Minimal deposit Rp 5.000'); return; }
        
        const user = JSON.parse(localStorage.getItem('lyz_user'));
        if (!user) { showAlert('Gagal', 'Login dulu!', 'login.html'); return; }

        const jumlahUnit = nominal / 1000;
        const linkTrakteer = `https://trakteer.id/rtx1ylgpaxmw2m32vpql/tip?quantity=${jumlahUnit}&message=${user.email}`;
        
        window.open(linkTrakteer, '_blank');
        showAlert('Instruksi', `Silakan selesaikan pembayaran Rp ${nominal.toLocaleString('id-ID')} di Trakteer.\n\nSaldo akan otomatis masuk setelah pembayaran berhasil.`, null);
    }

    let lastScrollTop = 0;
    const bottomNav = document.querySelector('.bottom-nav');
    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            bottomNav.style.transform = 'translateY(100%)';
        } else {
            bottomNav.style.transform = 'translateY(0)';
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
    });
</script>
</body>
</html>

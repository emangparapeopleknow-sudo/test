<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg-dark: #070b14; --card-bg: #111625; --card-border: #232c45; --primary: #7f5af0; --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); --text-main: #ffffff; --text-muted: #8b94b0; --success: #00e676; --danger: #ff3b30; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 450px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 30px 25px; position: relative; }
    .title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 20px; }
    .timer-box { background: rgba(255, 59, 48, 0.1); border: 1px solid rgba(255, 59, 48, 0.3); color: var(--danger); padding: 15px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 20px; margin-bottom: 25px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
    .detail-row span:first-child { color: var(--text-muted); }
    .detail-row span:last-child { font-weight: 700; }
</style>
<style>
    .method-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
    .method-title::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }
    .method-card { background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .method-card.active { border-color: var(--primary); background: rgba(127, 90, 240, 0.05); }
    .radio-btn { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .method-card.active .radio-btn { border-color: var(--primary); }
    .method-card.active .radio-btn::after { content: ''; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }
    .method-icon { width: 40px; height: 30px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 10px; color: #000; }
    .method-text h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .method-text p { font-size: 11px; color: var(--text-muted); }
    
    .btn-bayar { width: 100%; padding: 16px; background: var(--primary-grad); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 20px; }
    .btn-batal { width: 100%; padding: 16px; background: transparent; border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-muted); font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    
    .modal-qris { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 9998; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-qris.active { opacity: 1; visibility: visible; }
    .qris-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; text-align: center; width: 85%; max-width: 350px; transform: scale(0.9); transition: 0.3s; }
    .modal-qris.active .qris-box { transform: scale(1); }
    .qris-img { width: 200px; height: 200px; background: #fff; border-radius: 10px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    
    .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .custom-alert-overlay.active { opacity: 1; visibility: visible; }
    .custom-alert-box { background: #23252b; border: 1px solid #333; border-radius: 20px; padding: 25px; width: 85%; max-width: 350px; text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .custom-alert-overlay.active .custom-alert-box { transform: scale(1); }
    .custom-alert-box h3 { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .custom-alert-box p { color: #8b94b0; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .custom-alert-btn { background: transparent; border: none; color: #3b82f6; font-size: 16px; font-weight: 600; cursor: pointer; padding: 10px; }
</style>
</head>
<body>

  <div class="container">
    <div class="title">Konfirmasi Pembayaran</div>
    
    <div class="timer-box" id="timerBox">
        Sisa Waktu: <span id="timeDisplay">10:00</span>
    </div>

    <div class="detail-row">
        <span>Paket</span>
        <span id="namaPaket">-</span>
    </div>
    <div class="detail-row">
        <span>Total Bayar</span>
        <span id="hargaPaket" style="color: var(--success);">Rp 0</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid var(--card-border); padding-top: 15px; margin-top: 15px;">
        <span>Saldo Kamu</span>
        <span style="color: var(--text-muted);">Rp 0</span>
    </div>

    <div class="method-title">PILIH METODE PEMBAYARAN</div>
    
    <div class="method-card active" onclick="selectMethod(this, 'saldo')">
        <div class="radio-btn"></div>
        <div class="method-icon" style="background: var(--success); color: #fff;">💰</div>
        <div class="method-text">
            <h4>Saldo Website</h4>
            <p>Potong saldo akun kamu secara instan</p>
        </div>
    </div>

    <div class="method-card" onclick="selectMethod(this, 'qris')">
        <div class="radio-btn"></div>
        <div class="method-icon">QRIS</div>
        <div class="method-text">
            <h4>QRIS / E-Wallet</h4>
            <p>GoPay, OVO, Dana, ShopeePay, dll</p>
        </div>
    </div>

    <button class="btn-bayar" onclick="konfirmasiBayar()">Bayar Sekarang</button>
    <button class="btn-batal" onclick="window.location.href='premium.html'">Batal</button>
</div>

<!-- Modal QRIS -->
<div class="modal-qris" id="qrisModal">
    <div class="qris-box">
        <h3 style="margin-bottom: 10px; font-size: 18px;">Scan QRIS</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Selesaikan pembayaran sebelum waktu habis.</p>
        <div class="qris-img">📱</div>
        <button class="btn-bayar" style="margin-top: 10px; padding: 12px;" onclick="suksesQris()">Saya Sudah Bayar</button>
        <button class="btn-batal" style="padding: 12px; margin-top: 5px;" onclick="tutupQris()">Tutup</button>
    </div>
</div>

  <script src="alert.js"></script>
<script>
    const paket = localStorage.getItem('lyz_checkout_paket') || 'Premium';
    const harga = localStorage.getItem('lyz_checkout_harga') || 13000;
    const saldoUser = 0; // Ubah jadi 0 karena dari nol
    
    document.getElementById('namaPaket').innerText = paket;
    document.getElementById('hargaPaket').innerText = 'Rp ' + parseInt(harga).toLocaleString('id-ID');

    let timeLeft = 600; 
    let isPaid = false;
    let selectedMethod = 'saldo';
    const timerElement = document.getElementById('timeDisplay');

    const countdown = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(countdown);
            if (!isPaid) {
                showAlert('Waktu Habis!', 'Waktu pembayaran telah habis. Pesanan dibatalkan otomatis.', 'premium.html');
                localStorage.removeItem('lyz_checkout_paket');
                localStorage.removeItem('lyz_checkout_harga');
            }
            return;
        }
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }, 1000);

    function selectMethod(element, method) {
        document.querySelectorAll('.method-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedMethod = method;
    }

    function konfirmasiBayar() {
        if (timeLeft <= 0) {
            showAlert('Gagal', 'Waktu sudah habis, kamu tidak bisa membayar.');
            return;
        }

        if (selectedMethod === 'saldo') {
            if (saldoUser < harga) {
                showAlert('Saldo Tidak Cukup', 'Saldo kamu kurang. Silakan top up dulu di menu Deposit.', 'deposit.html');
                return;
            }
            isPaid = true;
            clearInterval(countdown);
            showAlert('Pembayaran Berhasil', 'Terima kasih! Paket ' + paket + ' kamu sudah aktif.', 'creator.html');
        } 
        else if (selectedMethod === 'qris') {
            document.getElementById('qrisModal').classList.add('active');
        }
    }

    function suksesQris() {
        isPaid = true;
        clearInterval(countdown);
        document.getElementById('qrisModal').classList.remove('active');
        showAlert('Pembayaran Berhasil', 'Terima kasih! Paket ' + paket + ' kamu sudah aktif.', 'creator.html');
    }

    function tutupQris() {
        document.getElementById('qrisModal').classList.remove('active');
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Web - Dashboard</title>
<style>
    :root { --bg: #0a0c10; --text: #ffffff; --accent: #e6b450; --cursor: #5fb8ff; }
    * { box-sizing: border-box; }
    body {
        background-image: linear-gradient(to bottom, rgba(10, 12, 16, 0.7) 0%, rgba(10, 12, 16, 0.95) 100%), url('fantasia.png'); 
        background-size: cover; background-position: center top; background-attachment: fixed;
        background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
    }

    /* CUSTOM ALERT */
    #custom-alert {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999;
    }
    .alert-box {
        background: #12151c; padding: 30px; border-radius: 16px; border: 1px solid var(--accent);
        text-align: center; max-width: 300px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .alert-box p { margin-bottom: 20px; font-size: 16px; }
    .alert-box button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent); color: black; font-weight: bold; cursor: pointer; width: 100%;}

    /* UI LAINNYA (Sama kayak sebelumnya) */
    .navbar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; margin-bottom: 5vh; z-index: 10; }
    .tagline { font-size: 24px; font-weight: 800; color: #ff3333; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); line-height: 1.3; max-width: 60%; }
    .user-info { font-size: 14px; color: var(--accent); font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--accent); z-index: 105; }
    .user-info:hover { background: rgba(230,180,80,0.2); }

    .music-player { position: fixed; bottom: 30px; left: 30px; background: rgba(18, 21, 28, 0.9); padding: 15px 20px; border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50; display: flex; flex-direction: column; gap: 10px; min-width: 250px; max-width: 300px; }
    .music-top { display: flex; align-items: center; gap: 15px; }
    .music-btn { background: var(--accent); border: none; color: #000; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
    .music-info-box { display: flex; flex-direction: column; overflow: hidden; }
    .music-info { font-size: 14px; color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-artist { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 10px; color: #aaa; }
    .progress-bar { flex: 1; height: 5px; background: #333; border-radius: 5px; cursor: pointer; position: relative; }
    .progress-fill { height: 100%; background: var(--cursor); border-radius: 5px; width: 0%; pointer-events: none; }

    .menu-container { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 10px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; z-index: 105; }
    .menu-icon { font-size: 24px; color: white; line-height: 1; }

    .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background-color: rgba(18, 21, 28, 0.98); backdrop-filter: blur(15px); border-left: 1px solid #333; padding: 40px 20px; transition: 0.3s ease-in-out; z-index: 110; box-shadow: -5px 0 20px rgba(0,0,0,0.8); }
    .sidebar.active { right: 0; }
    .sidebar h3 { color: var(--accent); margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .sidebar a { display: block; color: white; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.2s; font-size: 16px; cursor: pointer; }
    .sidebar a:hover { background: var(--accent); color: black; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }

    .dashboard { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; max-width: 600px; margin-bottom: 10vh; z-index: 10; }
    .row-top { display: flex; gap: 20px; justify-content: center; width: 100%; margin-bottom: 30px; }
    
    /* TOMBOL MULAI BIKIN WEB */
    .btn-start { padding: 20px 50px; border-radius: 50px; font-weight: 800; font-size: 22px; cursor: pointer; background: rgba(230, 180, 80, 0.9); border: 2px solid var(--accent); color: #000; box-shadow: 0 8px 32px rgba(230,180,80,0.4); text-decoration: none; text-align: center; transition: 0.3s; margin-bottom: 20px; width: 100%;}
    .btn-start:hover { background: var(--accent); transform: scale(1.02); box-shadow: 0 10px 40px rgba(230,180,80,0.6); }
    
    .btn-oval { padding: 18px 45px; border-radius: 50px; font-weight: 800; font-size: 20px; cursor: pointer; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; text-decoration: none; text-align: center; transition: 0.3s; }
    .btn-rect { padding: 18px 40px; border-radius: 10px; font-weight: bold; font-size: 20px; cursor: pointer; background: rgba(255, 255, 255, 0.8); color: #000; text-decoration: none; text-align: center; transition: 0.3s; line-height: 1.3; }

    @media (max-width: 450px) {
        .tagline { font-size: 20px; }
        .row-top { flex-direction: column; gap: 15px; }
        .btn-oval, .btn-rect, .btn-start { width: 100%; }
        .music-player { bottom: 20px; left: 20px; right: 20px; min-width: auto; max-width: none; }
    }
</style>
</head>
<body>

    <!-- CUSTOM ALERT -->
    <div id="custom-alert">
        <div class="alert-box">
            <p id="alert-text">Pesan</p>
            <button onclick="closeAlert()">Oke</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <audio id="bg-music" loop src=""></audio>

    <div class="navbar">
        <div class="tagline">"Make Your Own Web,<br>For Your Own Way"</div>
        <div class="user-info" id="user-display" onclick="logout()">Logout</div>
        <div class="menu-container" onclick="toggleMenu()"><div class="menu-icon">☰</div></div>
    </div>

    <!-- MUSIC PLAYER (Sama kayak sebelumnya) -->
    <div class="music-player">
        <div class="music-top">
            <button class="music-btn" id="play-btn" onclick="toggleMusic()">▶</button>
            <div class="music-info-box">
                <div class="music-info" id="now-playing">Belum ada lagu</div>
                <div class="music-artist" id="now-artist">Cari lagu dulu</div>
            </div>
        </div>
        <div class="progress-container">
            <span id="curr-time">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <div class="sidebar" id="mySidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <h3>Menu Creator</h3>
        <a onclick="showAlert('Fitur Kotak Masuk segera hadir!')">📬 Kotak Masuk</a>
        <a href="chat.html">📜 History Permintaan</a>
        <a onclick="showAlert('Fitur Cari Lagu segera hadir!')">🎵 Cari Lagu</a>
        <a onclick="showAlert('Fitur Pengaturan segera hadir!')">⚙️ Pengaturan</a>
    </div>

    <div class="dashboard">
        <!-- TOMBOL MULAI BIKIN WEB -->
        <a href="#" class="btn-start" onclick="cekLoginDanMasuk()">🚀 Mulai Bikin Web?</a>
        
        <div class="row-top">
            <a href="#" class="btn-oval" onclick="showAlert('Masuk ke AI Generator (Segera)')">Lihat Template</a>
            <a href="#" class="btn-oval" onclick="showAlert('Masuk ke Halaman Langganan (Segera)')">Langganan</a> 
        </div>
        <a href="index.html" class="btn-rect">Menuju<br>LyzLearnTyping</a>
    </div>

<script>
    let isLoginMode = true; // Dummy variable buat logic

    // Cek Login dari LocalStorage
    window.onload = function() {
        const activeUser = localStorage.getItem('creator_active_user');
        if (activeUser) {
            document.getElementById('user-display').innerText = `Halo, ${activeUser} (Logout)`;
        } else {
            document.getElementById('user-display').innerText = `Login / Daftar`;
        }
    }

    function cekLoginDanMasuk() {
        const activeUser = localStorage.getItem('creator_active_user');
        if (activeUser) {
            // Kalau udah login, lempar ke halaman chat
            window.location.href = "chat.html";
        } else {
            // Kalau belum, munculin alert custom
            showAlert("Lu harus Login dulu buat mulai bikin web, Bily!");
        }
    }

    function logout() {
        const activeUser = localStorage.getItem('creator_active_user');
        if (!activeUser) {
            window.location.href = "login.html"; // Lempar ke login kalau belum masuk
            return;
        }
        if (confirm("Yakin mau keluar dari akun?")) {
            localStorage.removeItem('creator_active_user');
            window.location.href = "login.html";
        }
    }

    // CUSTOM ALERT LOGIC
    function showAlert(msg) {
        document.getElementById('alert-text').innerText = msg;
        document.getElementById('custom-alert').style.display = 'flex';
    }
    function closeAlert() {
        document.getElementById('custom-alert').style.display = 'none';
    }

    // MENU & MUSIK (Sama kayak kode sebelumnya)
    const sidebar = document.getElementById('mySidebar');
    const overlay = document.getElementById('overlay');
    function toggleMenu() { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); }

    // (Kode musik lu taruh di sini, gua singkat biar ga kepanjangan)
    const music = document.getElementById('bg-music');
    let isSongLoaded = false;
    function toggleMusic() { if(!isSongLoaded) return showAlert("Cari lagu dulu!"); if(music.paused){music.play(); playBtn.innerHTML="⏸";}else{music.pause(); playBtn.innerHTML="▶";} }
    function seekAudio(e) {}
    function bukaModalLagu() {}
    function tutupModalLagu() {}
    async function cariLagu() { showAlert("Fitur cari lagu dipindah ke update selanjutnya."); }
    function putarLagu(url, judul, artis) { music.src=url; music.load(); nowPlaying.innerText=judul; nowArtist.innerText=artis; isSongLoaded=true; music.play(); playBtn.innerHTML="⏸"; tutupModalLagu(); }
</script>
</body>
</html>

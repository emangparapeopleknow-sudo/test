<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Riwayat Transaksi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg-dark: #070b14; --card-bg: #111625; --card-border: #232c45; --primary: #7f5af0; --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); --text-main: #ffffff; --text-muted: #8b94b0; --success: #00e676; --danger: #ff3b30; --warning: #ffcc00; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-dark); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: 800; font-size: 20px; color: #fff; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .saldo-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
    .saldo-text h4 { font-size: 14px; font-weight: 800; }
    .saldo-text p { font-size: 10px; color: var(--primary); }
    .btn-wallet { background: var(--primary-grad); border: none; width: 30px; height: 30px; border-radius: 8px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title-left { display: flex; align-items: center; gap: 15px; }
    .btn-back { width: 40px; height: 40px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-size: 18px; }
    .title-icon { width: 40px; height: 40px; background: rgba(127, 90, 240, 0.1); color: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .title-text h2 { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .title-text p { font-size: 12px; color: var(--text-muted); }
    .btn-home { width: 40px; height: 40px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-size: 18px; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(17, 22, 37, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0 15px 0; z-index: 100; transition: transform 0.3s ease-in-out; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #8b94b0; text-decoration: none; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active { color: #7f5af0; }
</style>
<style>
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .filter-chip { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .filter-chip.active { background: rgba(127, 90, 240, 0.1); border-color: var(--primary); color: var(--primary); }
    
    .category-row { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .category-row::-webkit-scrollbar { display: none; }
    .category-chip { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .category-chip.active { background: rgba(127, 90, 240, 0.1); border-color: var(--primary); color: var(--primary); }
    .category-chip .count { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; font-size: 10px; }
    .category-chip.active .count { background: var(--primary); color: #fff; }

    .empty-state { text-align: center; padding: 40px 20px; background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 16px; margin-top: 10px; }
    .empty-state .icon { font-size: 40px; color: var(--text-muted); margin-bottom: 15px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
    .empty-state p { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">LyzCreator</div>
    <div class="topbar-right">
        <div class="saldo-box">
            <div class="saldo-text"><h4>Rp 0</h4><p>Saldo Utama</p></div>
            <button class="btn-wallet">💼</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header-title">
        <div class="title-left">
            <a href="creator.html" class="btn-back">←</a>
            <div class="title-icon">🧾</div>
            <div class="title-text">
                <h2>Riwayat<br>Transaksi</h2>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">0 transaksi</div>
            <a href="creator.html" class="btn-home">🏠</a>
        </div>
    </div>

    <div class="filter-row">
        <div class="filter-label">📅 Rentang</div>
        <button class="filter-chip">Hari Ini</button>
        <button class="filter-chip">7 Hari</button>
        <button class="filter-chip">1 Bulan</button>
        <button class="filter-chip active">Semua Waktu</button>
    </div>

    <div class="category-row">
        <button class="category-chip active">⊞ Semua <span class="count">0</span></button>
        <button class="category-chip">🏦 Deposit <span class="count">0</span></button>
        <button class="category-chip">🎟️ Langganan <span class="count">0</span></button>
        <button class="category-chip">✅ Berhasil <span class="count">0</span></button>
        <button class="category-chip">❌ Gagal <span class="count">0</span></button>
        <button class="category-chip">⏰ Pending <span class="count">0</span></button>
    </div>

      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>Belum ada transaksi</h3>
        <p>Riwayat pembelian dan deposit kamu akan muncul di sini.</p>
    </div>

</div>

<script>
    async function aktivasiKode() {
        const code = document.getElementById('inputKode').value;
        const user = JSON.parse(localStorage.getItem('lyz_user'));
        if (!code) { showAlert('Gagal', 'Masukkan kode!'); return; }
        if (!user) { showAlert('Gagal', 'Login dulu!', 'login.html'); return; }

        // GANTI URL INI PAS UDAH DEPLOY VERCEL
        try {
            const res = await fetch('https://test-dhrs.vercel.app:3000/api/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, code: code })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('lyz_user', JSON.stringify(data.user));
                showAlert('Berhasil', data.message, 'creator.html');
            } else {
                showAlert('Gagal', data.message);
            }
        } catch (e) { showAlert('Error', 'Gagal terhubung.'); }
    }

    async function loadTransactions() {
        const user = JSON.parse(localStorage.getItem('lyz_user'));
        if (!user) return;
        // GANTI URL INI PAS UDAH DEPLOY VERCEL
        try {

            const data = await res.json();

    }

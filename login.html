<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyzCreator - Auth</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    :root { --bg-dark: #070b14; --card-bg: #111625; --primary: #7f5af0; --primary-grad: linear-gradient(135deg, #2a1b6b 0%, #4b2c9e 100%); --text-light: #ffffff; --text-muted: #8b94b0; --input-bg: #1a2035; --input-border: #2b3452; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; min-height: 100vh; }
    .mobile-wrapper { width: 100%; max-width: 480px; background-color: var(--bg-dark); position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .hero { background: var(--primary-grad); height: 280px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; }
    .hero-orbits { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
    .orbit-center { width: 80px; height: 80px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 2; }
    .orbit-center span { font-size: 30px; font-weight: 900; color: #2a1b6b; }
    .orbit-item { position: absolute; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.15); color: #2a1b6b; font-size: 20px; }
    .orbit-1 { top: 10px; right: 20px; } .orbit-2 { bottom: 20px; left: 20px; } .orbit-3 { bottom: 10px; right: 30px; }
    .hero h1 { color: #fff; margin-top: 15px; font-size: 24px; font-weight: 800; } .hero p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 5px; }
    .form-card { background-color: var(--card-bg); flex: 1; margin-top: -30px; border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 30px 25px; position: relative; z-index: 10; display: flex; flex-direction: column; }
    .form-header { text-align: center; margin-bottom: 25px; } .form-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 5px; } .form-header p { font-size: 13px; color: var(--text-muted); }
    .form-group { margin-bottom: 18px; } .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .input-wrapper { display: flex; align-items: center; background-color: var(--input-bg); border: 1px solid var(--input-border); border-radius: 50px; padding: 5px; }
    .input-wrapper:focus-within { border-color: var(--primary); }
    .input-icon { width: 40px; height: 40px; background: rgba(127, 90, 240, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); margin-right: 10px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-light); font-size: 14px; padding: 10px 0; }
    .toggle-password { background: none; border: none; color: var(--text-muted); padding: 0 15px; cursor: pointer; font-size: 16px; }
    .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
    .forgot-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .btn-primary { width: 100%; padding: 15px; background: var(--primary-grad); border: none; border-radius: 50px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: var(--text-muted); font-size: 12px; font-weight: 600; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--input-border); }
    .divider::before { margin-right: 15px; } .divider::after { margin-left: 15px; }
    
    .google-btn-container { display: flex; justify-content: center; }
    
    .footer-text { text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-muted); } .footer-text a { color: var(--primary); text-decoration: none; font-weight: 700; cursor: pointer; }
    .terms { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 20px; } .terms a { color: var(--primary); text-decoration: none; }
    .copyright { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: auto; padding-top: 20px; padding-bottom: 10px; }
</style>
</head>
<body>
<div class="mobile-wrapper">
    <div class="hero">
        <div class="hero-orbits">
            <div class="orbit-item orbit-1">🔒</div><div class="orbit-item orbit-2">👤</div><div class="orbit-item orbit-3">✉️</div>
            <div class="orbit-center"><span>L</span></div>
        </div>
        <h1>LyzCreator</h1><p id="hero-subtitle">Selamat datang kembali! 👋</p>
    </div>
    <div class="form-card">
        <div class="form-header"><h2 id="form-title">Masuk ke Akun</h2><p id="form-desc">Akses dashboard LyzCreator kamu</p></div>
        <form id="auth-form">
            <div class="form-group" id="group-username" style="display: none;"><label>Username</label><div class="input-wrapper"><div class="input-icon">👤</div><input type="text" placeholder="Pilih username"></div></div>
            <div class="form-group"><label id="label-email">Email</label><div class="input-wrapper"><div class="input-icon">✉️</div><input type="text" id="input-email" placeholder="Masukkan email" required></div></div>
            <div class="form-group"><label>Password</label><div class="input-wrapper"><div class="input-icon">🔒</div><input type="password" id="input-password" placeholder="Min. 8 karakter" required><button type="button" class="toggle-password" onclick="document.getElementById('input-password').type = document.getElementById('input-password').type === 'password' ? 'text' : 'password'">👁️</button></div></div>
            <div class="form-options" id="options-login"><label class="checkbox-wrap"><input type="checkbox"> Ingat Saya</label><a href="#" class="forgot-link">Lupa Password?</a></div>
            <button type="submit" class="btn-primary" id="submit-btn">Masuk</button>
        </form>
        <div class="divider">ATAU</div>
        
        <!-- GOOGLE LOGIN BUTTON -->
        <div class="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="81989745926-a9ulu337intog9gjacu3jnd3gjdnlk1k.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" 
                 data-type="standard" 
                 data-size="large" 
                 data-theme="filled_black" 
                 data-text="signin_with" 
                 data-shape="pill" 
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="footer-text"><span id="toggle-text">Belum punya akun?</span> <a onclick="toggleMode()" id="toggle-btn">Daftar sekarang</a></div>
        <div class="terms" id="terms-text" style="display: none;">Dengan membuat akun, kamu menyetujui <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a> kami.</div>
        <div class="copyright">© 2026 LyzCreator • Developer: Lyz</div>
    </div>
</div>
<script src="alert.js"></script>
<script>
    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "Masuk ke Akun" : "Buat Akun Baru";
        document.getElementById('form-desc').innerText = isLogin ? "Akses dashboard LyzCreator kamu" : "Daftar dan mulai gunakan layanan";
        document.getElementById('label-email').innerText = isLogin ? "Email" : "Alamat Email";
        document.getElementById('options-login').style.display = isLogin ? "flex" : "none";
        document.getElementById('submit-btn').innerText = isLogin ? "Masuk" : "Daftar";
        document.getElementById('toggle-text').innerText = isLogin ? "Belum punya akun?" : "Sudah punya akun?";
        document.getElementById('toggle-btn').innerText = isLogin ? "Daftar sekarang" : "Masuk di sini";
        document.getElementById('terms-text').style.display = isLogin ? "none" : "block";
        document.getElementById('group-username').style.display = isLogin ? "none" : "block";
        document.getElementById('hero-subtitle').innerText = isLogin ? "Selamat datang kembali! 👋" : "Buat akun baru 🚀";
        document.getElementById('input-password').placeholder = isLogin ? "Masukkan password" : "Min. 8 karakter";
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('input-email').value;
        const pass = document.getElementById('input-password').value;
        const btn = document.getElementById('submit-btn');

        if (pass.length < 8) { showAlert('Password Salah', 'Password minimal 8 karakter!'); return; }

        btn.innerText = "Memproses..."; btn.disabled = true;

        const endpoint = isLogin ? 'http://localhost:3000/api/login' : 'http://localhost:3000/api/register';
        
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama: email.split('@')[0], email: email, password: pass })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem('lyz_session', 'true');
                localStorage.setItem('lyz_user', JSON.stringify(data.user));
                showAlert('Berhasil', data.message, 'creator.html');
            } else {
                showAlert('Gagal', data.message);
                btn.innerText = isLogin ? "Masuk" : "Daftar"; 
                btn.disabled = false;
            }
        } catch (error) {
            showAlert('Error', 'Gagal terhubung ke server.');
            btn.innerText = isLogin ? "Masuk" : "Daftar"; 
            btn.disabled = false;
        }
    });
    // Fungsi Callback yang dipanggil Google setelah user milih akun
    function handleCredentialResponse(response) {
        // response.credential isinya JWT Token dari Google
        fetch('http://localhost:3000/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: response.credential })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('lyz_session', 'true');
                localStorage.setItem('lyz_user', JSON.stringify(data.user));
                showAlert('Berhasil', 'Login dengan Google Berhasil!', 'creator.html');
            } else {
                showAlert('Gagal', data.message);
            }
        })
        .catch(err => showAlert('Error', 'Gagal terhubung ke server.'));
    }
</script>
</body>
</html>
